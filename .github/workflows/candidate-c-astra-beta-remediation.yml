name: Candidate C Astra Studio Beta Remediation Qualification

on:
  pull_request:
    paths:
      - 'src/candidate-c/**'
      - 'views/candidate-c/**'
      - 'public/css/candidate-c*.css'
      - 'public/js/candidate-c-studio.js'
      - 'scripts/candidate-c-astra-beta-remediation-browser.js'
      - 'scripts/candidate-c-astra-beta-remediation-browser-v2.js'
      - 'scripts/candidate-c-astra-beta-remediation-browser-v3.js'
      - 'scripts/candidate-c-dogfood.js'
      - 'test/candidate-c-astra-beta-remediation*.test.js'
      - '.github/workflows/candidate-c-astra-beta-remediation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-c-astra-beta-remediation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Synthetic product-wide remediation qualification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Bind exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          echo "CANDIDATE_C_ASTRA_BETA_REMEDIATION_EXACT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CANDIDATE_C_ASTRA_BETA_REMEDIATION_EXACT_TREE=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"
      - name: Verify exact runtime provenance
        run: npm run release:check:runtime
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Run Astra beta remediation contracts
        run: node --test --test-concurrency=1 test/candidate-c-astra-beta-remediation*.test.js test/candidate-c-phase2b-h1.test.js
      - name: Install pinned Chromium runtime
        run: npx --no-install playwright install --with-deps chromium
      - name: Run synthetic product-wide remediation browser proof
        env:
          CANDIDATE_C_ASTRA_BETA_REMEDIATION_ROOT: artifacts/candidate-c-astra-beta-remediation
        run: node scripts/candidate-c-astra-beta-remediation-browser-v3.js
      - name: Publish Astra beta remediation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-c-astra-beta-remediation-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/candidate-c-astra-beta-remediation
          if-no-files-found: warn
          retention-days: 90
      - name: Summarize Astra beta remediation evidence
        if: success()
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('artifacts/candidate-c-astra-beta-remediation/manifest.json', 'utf8'));
          console.log('## Candidate C Astra Studio beta remediation qualification');
          console.log('');
          console.log(`- Exact candidate: ${manifest.candidate}`);
          console.log(`- Exact tree: ${manifest.tree}`);
          console.log(`- Synthetic fixtures: ${manifest.fixture.slug}, ${manifest.fixture.secondarySlug}`);
          console.log(`- Screenshots: ${manifest.summary.screenshotCount}`);
          console.log(`- Blocking accessibility findings: ${manifest.summary.blockingAccessibilityFindings}`);
          console.log(`- Horizontal overflow findings: ${manifest.summary.horizontalOverflowFindings}`);
          console.log(`- Incomplete images: ${manifest.summary.incompleteImageFindings}`);
          console.log(`- External product requests: ${manifest.summary.externalRequests}`);
          console.log(`- Unexpected console/page errors: ${manifest.summary.unexpectedConsoleErrors}`);
          console.log(`- Existing Activity identity preserved: ${manifest.proof.reschedule.activityIdPreserved}`);
          console.log(`- Scheduled + cancelled ICS captured: ${manifest.proof.reschedule.scheduledIcsCaptured}/${manifest.proof.reschedule.cancelledIcsCaptured}`);
          console.log(`- Cross-Direction parity: ${manifest.proof.parity.families.join(', ')}`);
          console.log(`- Oversized valid PNG safe failure: ${manifest.proof.safeOversizedValidPng}`);
          console.log(`- Malformed media safe failure: ${manifest.proof.safeMalformedMedia}`);
          console.log(`- Contact classes through Quick + deep: ${manifest.proof.contactClassesThroughQuickAndDeep.map((item) => item.kind).join(', ')}`);
          console.log(`- Quick/deep Look Bar Gold parity: ${manifest.proof.quickDeepLookBarGold}`);
          console.log(`- Completed + cancelled lifecycle: ${manifest.proof.completedAndCancelledLifecycle}`);
          console.log(`- Restore preserved live site: ${manifest.proof.restoreDidNotChangeLive}`);
          console.log(`- Stale Release rejected: ${manifest.proof.staleReleaseRejected}`);
          console.log(`- Stale urgent rejected: ${manifest.proof.staleUrgentRejected}`);
          console.log(`- Urgent preserved unrelated draft: ${manifest.proof.urgentPreservedUnpublishedDraft}`);
          console.log(`- Multi-host restart persistence: ${manifest.proof.restart.persisted}/${manifest.proof.restart.multiHost}`);
          console.log(`- Persisted RSVP/media/logo/focal: ${manifest.proof.restart.rsvps}/${manifest.proof.restart.heroSha256}/${manifest.proof.restart.logoSha256}/${JSON.stringify(manifest.proof.restart.focal)}`);
          console.log(`- Native 390px public + Studio proof: ${manifest.proof.native390PublicAndStudio}`);
          console.log(`- External effects: ${JSON.stringify(manifest.proof.external)}`);
          NODE

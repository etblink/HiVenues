name: Era 5 production signing

on:
  workflow_dispatch:
    inputs:
      qualification_run_id:
        description: 'Successful Era 5 clean-machine installer workflow run ID containing the exact unsigned installer to promote.'
        required: true
        type: string
      source_sha:
        description: 'Exact 40-character Git source SHA bound by the unsigned installer provenance.'
        required: true
        type: string
      unsigned_sha256:
        description: 'Exact 64-character SHA-256 of the qualified unsigned installer.'
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: era5-production-signing
  cancel-in-progress: false

jobs:
  sign:
    name: Promote and Authenticode-sign exact qualified installer
    runs-on: windows-latest
    timeout-minutes: 20
    environment: production-signing
    steps:
      - name: Validate explicit promotion inputs
        shell: pwsh
        run: |
          if ('${{ inputs.source_sha }}' -notmatch '^[a-f0-9]{40}$') { throw 'source_sha must be an exact lowercase 40-character Git SHA.' }
          if ('${{ inputs.unsigned_sha256 }}' -notmatch '^[a-f0-9]{64}$') { throw 'unsigned_sha256 must be an exact lowercase SHA-256.' }
          if ('${{ inputs.qualification_run_id }}' -notmatch '^\d+$') { throw 'qualification_run_id must be a GitHub Actions run ID.' }

      - name: Check out exact promoted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Download exact clean-machine qualification artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: hivenues-clean-machine-installer-${{ inputs.qualification_run_id }}-*
          path: ${{ runner.temp }}\qualified-unsigned
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.qualification_run_id }}

      - name: Promote exact unsigned installer
        shell: pwsh
        run: |
          ./scripts/era5/prepare-production-signing.ps1 -ArtifactRoot "$env:RUNNER_TEMP\qualified-unsigned" -OutputDirectory "$env:RUNNER_TEMP\promotion" -ExpectedSourceSha "${{ inputs.source_sha }}" -ExpectedUnsignedSha256 "${{ inputs.unsigned_sha256 }}" -QualificationRunId "${{ inputs.qualification_run_id }}"

      - name: Resolve promoted installer path
        id: promoted
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\promotion" -Filter 'HiVenues-Studio-*-windows-x64-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Promoted installer was not staged.' }
          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT

      - name: Azure login through GitHub OIDC
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign installer with Microsoft Artifact Signing Public Trust
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ steps.promoted.outputs.installer }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signature and bind signed provenance
        shell: pwsh
        env:
          EXPECTED_PUBLISHER_SUBJECT: ${{ vars.HIVENUES_PUBLISHER_SUBJECT }}
        run: |
          ./scripts/era5/finalize-production-signing.ps1 -SignedInstaller "${{ steps.promoted.outputs.installer }}" -PromotionManifest "$env:RUNNER_TEMP\promotion\hivenues-production-signing-promotion.json" -OutputDirectory "$env:RUNNER_TEMP\signed" -ExpectedPublisherSubject "$env:EXPECTED_PUBLISHER_SUBJECT"
          Copy-Item -LiteralPath "./scripts/era5/qualify-clean-machine.ps1" -Destination "$env:RUNNER_TEMP\signed\qualify-clean-machine.ps1"
          Copy-Item -LiteralPath "$env:RUNNER_TEMP\promotion\hivenues-production-signing-promotion.json" -Destination "$env:RUNNER_TEMP\signed\hivenues-production-signing-promotion.json"

      - name: Upload signed qualification package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hivenues-production-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}\signed\*.exe
            ${{ runner.temp }}\signed\*.sha256
            ${{ runner.temp }}\signed\*.provenance.json
            ${{ runner.temp }}\signed\qualify-clean-machine.ps1
            ${{ runner.temp }}\signed\hivenues-production-signing-promotion.json
          if-no-files-found: error
          retention-days: 14

  signed-clean-machine:
    name: Qualify signed installer on fresh Windows runner
    needs: sign
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download exact signed qualification package
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: hivenues-production-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\signed-qualification

      - name: Qualify signed clean-machine lifecycle
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\signed-qualification\qualify-clean-machine.ps1" -ArtifactRoot "$env:RUNNER_TEMP\signed-qualification" -EvidenceOutput "$env:RUNNER_TEMP\signed-clean-machine-evidence" -ExpectedSigning 'authenticode-public-trust'

      - name: Upload signed clean-machine evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hivenues-production-signed-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\signed-clean-machine-evidence
          if-no-files-found: warn
          retention-days: 14

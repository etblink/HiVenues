name: V3 S4 Cross-Host Browser Qualification

on:
  pull_request:
    paths:
      - 'src/venue/v3/**'
      - 'test/support/v3-authoring-studio-fixture.js'
      - 'test/support/v3-reference-fixtures.js'
      - 'test/venue-v3-cross-host-studio.test.js'
      - 'test/v3-s9-review-target.test.js'
      - 'scripts/support/v3-s9-review-target.js'
      - 'scripts/open-v3-s9-review-target.js'
      - 'scripts/capture-v3-cross-host-journeys-visual.js'
      - 'scripts/capture-v3-s7-generated-experience-visual.js'
      - 'scripts/capture-v3-s8-social-surface-visual.js'
      - 'scripts/capture-v3-s9-measured-baseline.js'
      - 'docs/V3_CROSS_HOST_COMPLETE_OPERATOR_JOURNEYS_CONTRACT_0_1_0.md'
      - 'docs/PM4_S9_MEASURED_QUALITY_RELEASE_PROTOCOL_0_1_0.md'
      - '.github/workflows/v3-s4-browser.yml'
  push:
    branches:
      - main
    paths:
      - 'src/venue/v3/**'
      - 'test/support/v3-authoring-studio-fixture.js'
      - 'test/support/v3-reference-fixtures.js'
      - 'test/venue-v3-cross-host-studio.test.js'
      - 'test/v3-s9-review-target.test.js'
      - 'scripts/support/v3-s9-review-target.js'
      - 'scripts/open-v3-s9-review-target.js'
      - 'scripts/capture-v3-cross-host-journeys-visual.js'
      - 'scripts/capture-v3-s7-generated-experience-visual.js'
      - 'scripts/capture-v3-s8-social-surface-visual.js'
      - 'scripts/capture-v3-s9-measured-baseline.js'
      - 'docs/V3_CROSS_HOST_COMPLETE_OPERATOR_JOURNEYS_CONTRACT_0_1_0.md'
      - 'docs/PM4_S9_MEASURED_QUALITY_RELEASE_PROTOCOL_0_1_0.md'
      - '.github/workflows/v3-s4-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-s4-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-journeys:
    name: R1/R2/R3 Studio + real-renderer journeys (Ubuntu / pinned Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify exact runtime provenance
        run: npm run release:check:runtime
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Install pinned Chromium runtime
        run: npx --no-install playwright install --with-deps chromium
      - name: Build exact presentation assets
        run: npm run build
      - name: Verify S9 local review target
        run: node --test --test-concurrency=1 test/v3-s9-review-target.test.js
      - name: Run S4 cross-host complete operator journeys
        env:
          V3_S4_REVIEW_ROOT: artifacts/v3-s4-cross-host-review
        run: node scripts/capture-v3-cross-host-journeys-visual.js
      - name: Run S7 direct generated experience qualification
        env:
          V3_S4_REVIEW_ROOT: artifacts/v3-s4-cross-host-review
        run: node scripts/capture-v3-s7-generated-experience-visual.js
      - name: Run S8 social surface qualification
        env:
          V3_S4_REVIEW_ROOT: artifacts/v3-s4-cross-host-review
        run: node scripts/capture-v3-s8-social-surface-visual.js
      - name: Run S9 untouched measured baseline
        env:
          V3_S4_REVIEW_ROOT: artifacts/v3-s4-cross-host-review
        run: node scripts/capture-v3-s9-measured-baseline.js
      - name: Publish S4/S7/S8/S9 review evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v3-s4-cross-host-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/v3-s4-cross-host-review
          if-no-files-found: error
          retention-days: 90
      - name: Publish S4/S7/S8/S9 metrics
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('artifacts/v3-s4-cross-host-review/manifest.json', 'utf8'));
          const s7 = JSON.parse(fs.readFileSync('artifacts/v3-s4-cross-host-review/s7-generated-experience/manifest.json', 'utf8'));
          const s8 = JSON.parse(fs.readFileSync('artifacts/v3-s4-cross-host-review/s8-social-surface/manifest.json', 'utf8'));
          const s9 = JSON.parse(fs.readFileSync('artifacts/v3-s4-cross-host-review/s9-measured-baseline/manifest.json', 'utf8'));
          console.log('## V3 S4 cross-host operator journeys');
          console.log('');
          console.log(`- References completed: ${manifest.summary.referenceCount}`);
          console.log(`- Keyboard completions: ${manifest.summary.keyboardCompletionCount}`);
          console.log(`- Review screenshots: ${manifest.summary.screenshotCount}`);
          console.log(`- Blocking accessibility findings: ${manifest.summary.blockingAccessibilityFindings}`);
          console.log(`- Horizontal-overflow findings: ${manifest.summary.horizontalOverflowFindings}`);
          console.log(`- External browser requests: ${manifest.summary.externalRequests}`);
          console.log(`- Hive/provider writes: ${manifest.summary.hiveWrites}/${manifest.summary.providerWrites}`);
          console.log(`- Payment/signing/deployment effects: ${manifest.summary.payments}/${manifest.summary.signingAttempts}/${manifest.summary.deployments}`);
          console.log('');
          console.log('## V3 S7 direct generated experience');
          console.log('');
          console.log(`- References completed: ${s7.summary.referenceCount}`);
          console.log(`- Visitor-only pages captured: ${s7.summary.visitorPageCount}`);
          console.log(`- Desktop/narrow screenshots: ${s7.summary.desktopScreenshotCount}/${s7.summary.narrowScreenshotCount}`);
          console.log(`- Blocking accessibility findings: ${s7.summary.blockingAccessibilityFindings}`);
          console.log(`- Horizontal/image-overflow findings: ${s7.summary.horizontalOverflowFindings}/${s7.summary.imageOverflowFindings}`);
          console.log(`- External browser requests: ${s7.summary.externalRequests}`);
          console.log(`- Hive/provider writes: ${s7.summary.hiveWrites}/${s7.summary.providerWrites}`);
          console.log(`- Payment/signing/deployment effects: ${s7.summary.payments}/${s7.summary.signingAttempts}/${s7.summary.deployments}`);
          console.log('');
          console.log('## V3 S8 social surface');
          console.log('');
          console.log(`- Capability variants: ${s8.summary.variantCount} (configured ${s8.summary.configuredCapabilityCount}; disabled ${s8.summary.disabledCapabilityCount})`);
          console.log(`- Desktop/narrow screenshots: ${s8.summary.desktopScreenshotCount}/${s8.summary.narrowScreenshotCount}`);
          console.log(`- Blocking accessibility findings: ${s8.summary.blockingAccessibilityFindings}`);
          console.log(`- Horizontal-overflow findings: ${s8.summary.horizontalOverflowFindings}`);
          console.log(`- External browser requests: ${s8.summary.externalRequests}`);
          console.log(`- Hive RPC attempts/writes: ${s8.summary.hiveRpcAttempts}/${s8.summary.hiveWrites}`);
          console.log(`- Provider writes: ${s8.summary.providerWrites}`);
          console.log('');
          console.log('## V3 S9 untouched measured baseline');
          console.log('');
          console.log(`- Deep references: ${s9.summary.referenceCount}`);
          console.log(`- Viewport-only screenshots: ${s9.summary.viewportOnlyScreenshotCount} (mobile ${s9.summary.mobileScreenshotCount}; tablet ${s9.summary.tabletScreenshotCount}; desktop ${s9.summary.desktopScreenshotCount})`);
          console.log(`- Home/detail screenshots: ${s9.summary.homeScreenshotCount}/${s9.summary.activityScreenshotCount}`);
          console.log(`- Accessibility violations: ${s9.summary.accessibilityViolationCount} (serious/critical ${s9.summary.seriousOrCriticalAccessibilityCount})`);
          console.log(`- Horizontal/image/incomplete-image findings: ${s9.summary.horizontalOverflowCount}/${s9.summary.imageOverflowCount}/${s9.summary.incompleteImageCount}`);
          console.log(`- Pages with action targets below 44px convention: ${s9.summary.below44pxActionTargetPageCount}`);
          console.log(`- Missing description/canonical/OG-title pages: ${s9.summary.missingDescriptionCount}/${s9.summary.missingCanonicalCount}/${s9.summary.missingOpenGraphTitleCount}`);
          console.log(`- JSON-LD blocks: ${s9.summary.jsonLdBlockCount}`);
          console.log(`- External browser requests: ${s9.summary.externalRequests}`);
          console.log(`- Screenshot bytes: ${s9.summary.screenshotBytes}`);
          console.log(`- Astra credits spent: ${s9.astraCreditsSpent}`);
          NODE
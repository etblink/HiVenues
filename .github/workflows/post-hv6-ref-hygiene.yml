name: Post-HV6 bounded ref hygiene

on:
  pull_request:
    paths:
      - '.github/workflows/post-hv6-ref-hygiene.yml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/post-hv6-ref-hygiene.yml'

permissions:
  contents: write

env:
  WORKFLOW_PATH: .github/workflows/post-hv6-ref-hygiene.yml
  ACTIVATION_PARENT: 1c5fca3f7207873a22981376bced738719578e80
  PRE_ACTIVATION_TREE: 62fdf5bc8fd15448d2e587cfccadbeb829fecf85
  TEMP_BRANCH: maintenance/ref-hygiene-post-hv6
  TEARDOWN_BRANCH: maintenance/ref-hygiene-post-hv6-teardown
  APPLY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  PR_HEAD: ${{ github.head_ref }}
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  custody:
    runs-on: ubuntu-latest
    steps:
      - name: Check out event commit with authenticated Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Verify exact disposition ledger and dry-run safety
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' --prune --force

          canonical_sha="$(git rev-parse refs/remotes/origin/main)"
          event_sha="$(git rev-parse HEAD)"
          printf 'EVENT_SHA=%s\n' "$event_sha"
          printf 'CANONICAL_MAIN=%s\n' "$canonical_sha"
          printf 'APPLY=%s\n' "$APPLY"
          printf 'PR_HEAD=%s\n' "$PR_HEAD"

          branch_ledger="$(mktemp)"
          cat >"$branch_ledger" <<'EOF'
          audit/main-tree-retirement-batch001-consumers|ea2c1017f5facc45e3ae093bbc1ccd982c9a40c7|DISPOSABLE||
          automation/main-tree-retirement-batch001-checkpoint-tag|ea3e87ead241eea2f6afdff56ce72411337bc169|ANCESTOR||
          continuity/v0.4.1-handoff-freeze|bead61a96f37394cde6f2407d9731cf8a191ef8a|ARCHIVE|archive/branch/continuity/v0.4.1-handoff-freeze|b3d1c9d176c8ad6499b03e49ec67ee69b5bbdaa5
          continuity/v0.5.0-c2-b-closure-freeze|af9f30b66d375ce06d82a98289d514a102aba5ed|ARCHIVE|archive/branch/continuity/v0.5.0-c2-b-closure-freeze|7e2568ccd1d7f068eec6221b1d897be4fe719496
          continuity/v0.5.0-c2-b-closure-freeze-check|e0d17a8edb8ce893983c68729d195ea2ac419153|ANCESTOR||
          continuity/v0.5.0-c2-b-closure-freeze-final|e0d17a8edb8ce893983c68729d195ea2ac419153|ANCESTOR||
          decision/post-hv4-sequencing|9aff26c1061edc872b343f57a6a766621e8694db|ANCESTOR||
          governance/hv4-acceptance|9867fc6d1f135602095157f3b568130b1deb08d6|DISPOSABLE||
          governance/hv5-acceptance|6529cc4ba9acf5ad76e6f23939fc4460c5afacf5|ANCESTOR||
          governance/hv5-implementation-authorization|2ae7dcefec4d499d6ba4bef462c8003945b40d0f|ANCESTOR||
          governance/hv5-preregistration-acceptance|57f6292f411c5fae656e0b097ef0e75f1eff30e7|ANCESTOR||
          governance/hv6-acceptance|6ad7c55a4e02a126d6d91f07847d76cfd33b8b8d|ANCESTOR||
          governance/hv6-implementation-authorization|2b67a2f4af4813e84bb539aa9136565dffb3fc1a|ANCESTOR||
          governance/hv6-native-phase-c-authorization|84e44fc54700e2102e1f826f2fb76791695bd15a|ANCESTOR||
          governance/hv6-preregistration-acceptance|dfd8dd477c11b5eaec8161cb2dfb2e61aec094d3|ANCESTOR||
          governance/main-tree-historical-artifact-retirement-policy|d069e76b971f64f7bea2434163e769bc9b1e678c|ANCESTOR||
          governance/main-tree-retirement-batch001-checkpoint-authorization|49dc1aadfb81c9d3e199c3dad1733794c46bb4a2|ANCESTOR||
          governance/main-tree-retirement-batch001-completion|eef5c6b8de9be3307fda4c4c9e21288b0fb46f98|ANCESTOR||
          governance/main-tree-retirement-batch001-docket|5753918b653e5ea4e860c29fd342252a934b40c3|ANCESTOR||
          governance/main-tree-retirement-batch001-execution-authorization|65b8479f188e5d181aa91f2775844002b45cb1d6|ANCESTOR||
          governance/post-hv3-sequencing-decision|20590dff2222a6dc855fabb9f0c4f8cb37cc2670|ANCESTOR||
          governance/post-hv5-sequencing-decision|869437bd8c7ed2e2130dc38054f4fa674cfb2532|ANCESTOR||
          hv6/bounded-dual-candidate-evaluation|3186f2b6f252feeb8bbf73948376e0803e6e17e7|DISPOSABLE||
          hv6/grapesjs-candidate-a-evaluation|7657387fb6117d6f508be4248f05e28527e21f7f|ARCHIVE|archive/branch/hv6/grapesjs-candidate-a-evaluation|8a6697408c68a6c6b4e5d16e23ae37522c73e1eb
          hv6/native-phase-c-foundation|3a432687518a961da219f763efe2333b4dca55d8|DISPOSABLE||
          maintenance/hv5-implementation-routing-reconciliation|68e722343b28a62b0a43fc883ad0dda6d64bdf2d|DISPOSABLE||
          maintenance/hv6-implementation-routing-reconciliation|c144b8defb265606931ea99c4c9a1711e6a6a43b|DISPOSABLE||
          maintenance/hv6-technology-selection-routing|3159b336aa4a406c16330ab28506963aa5898fb2|DISPOSABLE||
          maintenance/main-tree-retirement-batch001-delete|94874092c66dd77c907bb5d42bed2f323f9af962|ANCESTOR||
          maintenance/main-tree-retirement-batch001-tag-workflow-teardown|507ed568dc7718f536296b1d62260ad83157a568|ANCESTOR||
          maintenance/main-tree-retirement-policy-0.1.1|a6ca632bcaa57fc0ca05b9250a608f6a34d6b36b|ANCESTOR||
          maintenance/post-hv4-decision-routing-reconciliation|c4e6e7c4762156d04d9a616c1fb1406cbbb6924f|DISPOSABLE||
          maintenance/post-hv4-living-routing-reconciliation|1c890729a238921f6adbc5cb54e9d6b41e680f48|DISPOSABLE||
          maintenance/post-hv5-decision-routing-reconciliation|484f501760f2e2af275c5cb0cd855a5d2670041c|DISPOSABLE||
          maintenance/post-hv5-living-routing-reconciliation|d8fe03beae9817c38a3fd710970ff4bf2bf6eb9c|DISPOSABLE||
          maintenance/post-hv6-living-routing-reconciliation|3332fbfe2683bccc075312dabb9799098e8fe2da|DISPOSABLE||
          preregistration/hv5-venue-authoring-contract|f54a2a198ca5f9c37d5d78f6f97d06211a5d2869|ANCESTOR||
          preregistration/hv6-operator-visual-authoring-adapter|8556cf0c2d85d7f8a35175250e11fa9881354f2f|ANCESTOR||
          qualification/hv6-grapesjs-lock-generation|bff166e381706c026e5c09eaab363fd27ce8533d|DISPOSABLE||
          research/hv4-isolated-venue-bootstrap|5221af43254d1e2797714ea597e1c55589900936|DISPOSABLE||
          research/hv4-isolated-venue-bootstrap-qualification|e999edf081964d258e4a9b73734e0fedc14ce594|DISPOSABLE||
          research/hv5-venue-authoring-contract|720557a213f15fff05f7afc178bc10f10360dfcb|DISPOSABLE||
          EOF

          verify_archive_tag() {
            local tag_name="$1"
            local expected_commit="$2"
            local expected_tree="$3"
            local source_branch="$4"
            local tag_ref="refs/tags/$tag_name"
            local object_sha object_type peeled_commit peeled_tree tag_object

            object_sha="$(git rev-parse "$tag_ref")"
            object_type="$(git cat-file -t "$object_sha")"
            [[ "$object_type" == 'tag' ]] || {
              echo "Refusing operation: $tag_name exists but is not annotated." >&2
              exit 1
            }
            peeled_commit="$(git rev-parse "$tag_ref^{}")"
            peeled_tree="$(git rev-parse "$peeled_commit^{tree}")"
            [[ "$peeled_commit" == "$expected_commit" ]] || {
              echo "Refusing operation: $tag_name peels to wrong commit." >&2
              exit 1
            }
            [[ "$peeled_tree" == "$expected_tree" ]] || {
              echo "Refusing operation: $tag_name peels to wrong tree." >&2
              exit 1
            }

            tag_object="$(git cat-file -p "$object_sha")"
            grep -Fqx "SOURCE_BRANCH = $source_branch" <<<"$tag_object"
            grep -Fqx "SOURCE_COMMIT = $expected_commit" <<<"$tag_object"
            grep -Fqx "SOURCE_TREE = $expected_tree" <<<"$tag_object"
            grep -Fqx 'ARCHIVE_CLASSIFICATION = DURABLE_INDEPENDENT_HISTORICAL_EVIDENCE' <<<"$tag_object"
            grep -Fqx 'IMMUTABLE_BY_PROJECT_POLICY = YES' <<<"$tag_object"

            printf 'ARCHIVE_TAG_OK tag=%s object=%s commit=%s tree=%s\n' \
              "$tag_name" "$object_sha" "$peeled_commit" "$peeled_tree"
          }

          if [[ "$PR_HEAD" == "$TEARDOWN_BRANCH" ]]; then
            [[ "$APPLY" == 'false' ]]
            teardown_ref="refs/remotes/origin/$TEARDOWN_BRANCH"
            git show-ref --verify --quiet "$teardown_ref"
            teardown_tip="$(git rev-parse "$teardown_ref")"
            teardown_parent="$(git rev-parse "$teardown_tip^")"
            teardown_tree="$(git rev-parse "$teardown_tip^{tree}")"
            [[ "$teardown_parent" == "$canonical_sha" ]] || {
              echo 'Refusing teardown PR: teardown branch is not a direct child of canonical main.' >&2
              exit 1
            }
            [[ "$teardown_tree" == "$PRE_ACTIVATION_TREE" ]] || {
              echo 'Refusing teardown PR: teardown tree is not the exact pre-activation tree.' >&2
              exit 1
            }
            if git cat-file -e "$teardown_tip:$WORKFLOW_PATH" 2>/dev/null; then
              echo 'Refusing teardown PR: privileged workflow still exists in teardown tip.' >&2
              exit 1
            fi

            while IFS='|' read -r branch expected_sha class tag_name expected_tree; do
              [[ -n "$branch" ]] || continue
              if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
                echo "Refusing teardown PR: retired branch still exists: $branch" >&2
                exit 1
              fi
              if [[ "$class" == 'ARCHIVE' ]]; then
                git show-ref --verify --quiet "refs/tags/$tag_name" || {
                  echo "Refusing teardown PR: required archive tag missing: $tag_name" >&2
                  exit 1
                }
                verify_archive_tag "$tag_name" "$expected_sha" "$expected_tree" "$branch"
              fi
            done <"$branch_ledger"

            if git show-ref --verify --quiet "refs/remotes/origin/$TEMP_BRANCH"; then
              echo 'Refusing teardown PR: activation branch still exists.' >&2
              exit 1
            fi

            mapfile -t remaining < <(
              git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin |
              grep -v '^HEAD$' |
              sort
            )
            expected_remaining=(main "$TEARDOWN_BRANCH")
            mapfile -t expected_remaining < <(printf '%s\n' "${expected_remaining[@]}" | sort)
            [[ "$(printf '%s\n' "${remaining[@]}")" == "$(printf '%s\n' "${expected_remaining[@]}")" ]] || {
              printf 'Refusing teardown PR: unexpected branch namespace remains.\nObserved:\n%s\n' \
                "$(printf '%s\n' "${remaining[@]}")" >&2
              exit 1
            }

            echo 'TEARDOWN_DRY_RUN=PASS'
            echo 'NO_REFS_MUTATED=YES'
            exit 0
          fi

          if [[ "$APPLY" == 'false' && "$PR_HEAD" != "$TEMP_BRANCH" ]]; then
            echo 'Refusing dry run: workflow may only be qualified from the exact temporary capability branch.' >&2
            exit 1
          fi

          if [[ "$APPLY" == 'false' ]]; then
            temp_ref="refs/remotes/origin/$TEMP_BRANCH"
            git show-ref --verify --quiet "$temp_ref" || {
              echo 'Refusing dry run: temporary capability branch missing.' >&2
              exit 1
            }
            [[ "$(git rev-parse "$temp_ref")" == "$PR_HEAD_SHA" ]] || {
              echo 'Refusing dry run: temporary capability branch tip does not equal exact PR head SHA.' >&2
              exit 1
            }
          fi

          if [[ "$APPLY" == 'true' ]]; then
            [[ "$event_sha" == "$canonical_sha" ]] || {
              echo 'Refusing mutation: event commit is not exact canonical main.' >&2
              exit 1
            }
            [[ "$(git rev-parse "$event_sha^")" == "$ACTIVATION_PARENT" ]] || {
              echo 'Refusing mutation: activation commit is not direct child of authorized parent.' >&2
              exit 1
            }
            temp_ref="refs/remotes/origin/$TEMP_BRANCH"
            git show-ref --verify --quiet "$temp_ref" || {
              echo 'Refusing mutation: temporary capability branch missing.' >&2
              exit 1
            }
            [[ "$(git rev-parse "$temp_ref")" == "$canonical_sha" ]] || {
              echo 'Refusing mutation: temporary capability branch does not equal exact activation commit.' >&2
              exit 1
            }
          fi

          declare -A authorized
          while IFS='|' read -r branch expected_sha class tag_name expected_tree; do
            [[ -n "$branch" ]] || continue
            [[ "$branch" != 'main' ]] || {
              echo 'Refusing operation: main is present in authorized deletion ledger.' >&2
              exit 1
            }
            authorized["$branch"]=1
            remote_ref="refs/remotes/origin/$branch"
            git show-ref --verify --quiet "$remote_ref" || {
              echo "Refusing operation: expected branch missing: $branch" >&2
              exit 1
            }
            actual_sha="$(git rev-parse "$remote_ref")"
            [[ "$actual_sha" == "$expected_sha" ]] || {
              printf 'Refusing operation: branch-tip drift for %s expected=%s actual=%s\n' \
                "$branch" "$expected_sha" "$actual_sha" >&2
              exit 1
            }

            case "$class" in
              ANCESTOR)
                git merge-base --is-ancestor "$expected_sha" "$canonical_sha" || {
                  echo "Refusing operation: ANCESTOR classification failed for $branch" >&2
                  exit 1
                }
                ;;
              DISPOSABLE)
                ;;
              ARCHIVE)
                [[ "$(git rev-parse "$expected_sha^{tree}")" == "$expected_tree" ]] || {
                  echo "Refusing operation: archive target tree mismatch for $branch" >&2
                  exit 1
                }
                if git show-ref --verify --quiet "refs/tags/$tag_name"; then
                  verify_archive_tag "$tag_name" "$expected_sha" "$expected_tree" "$branch"
                else
                  printf 'ARCHIVE_TAG_STATE=ABSENT branch=%s tag=%s\n' "$branch" "$tag_name"
                fi
                ;;
              *)
                echo "Refusing operation: unknown classification $class for $branch" >&2
                exit 1
                ;;
            esac
            printf 'BRANCH_BINDING_OK branch=%s sha=%s class=%s\n' "$branch" "$expected_sha" "$class"
          done <"$branch_ledger"

          mapfile -t observed_branches < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin |
            grep -v '^HEAD$' |
            sort
          )
          for branch in "${observed_branches[@]}"; do
            [[ "$branch" == 'main' ]] && continue
            [[ "$branch" == "$TEMP_BRANCH" ]] && continue
            [[ -n "${authorized[$branch]:-}" ]] || {
              echo "Refusing operation: unclassified branch appeared: $branch" >&2
              exit 1
            }
          done

          expected_count="$(wc -l <"$branch_ledger" | tr -d ' ')"
          observed_authorized=0
          for branch in "${observed_branches[@]}"; do
            [[ -n "${authorized[$branch]:-}" ]] && observed_authorized=$((observed_authorized + 1))
          done
          [[ "$observed_authorized" == "$expected_count" ]] || {
            echo 'Refusing operation: authorized branch count mismatch.' >&2
            exit 1
          }

          if [[ "$APPLY" == 'false' ]]; then
            echo 'PR_DRY_RUN=PASS'
            echo 'NO_REFS_MUTATED=YES'
          fi

      - name: Create only authorized immutable annotated archive tags
        if: env.APPLY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' --prune --force

          archive_ledger="$(mktemp)"
          cat >"$archive_ledger" <<'EOF'
          continuity/v0.4.1-handoff-freeze|bead61a96f37394cde6f2407d9731cf8a191ef8a|archive/branch/continuity/v0.4.1-handoff-freeze|b3d1c9d176c8ad6499b03e49ec67ee69b5bbdaa5
          continuity/v0.5.0-c2-b-closure-freeze|af9f30b66d375ce06d82a98289d514a102aba5ed|archive/branch/continuity/v0.5.0-c2-b-closure-freeze|7e2568ccd1d7f068eec6221b1d897be4fe719496
          hv6/grapesjs-candidate-a-evaluation|7657387fb6117d6f508be4248f05e28527e21f7f|archive/branch/hv6/grapesjs-candidate-a-evaluation|8a6697408c68a6c6b4e5d16e23ae37522c73e1eb
          EOF

          git config user.name 'Evan Kotler'
          git config user.email 'etblink@users.noreply.github.com'

          push_refs=()
          while IFS='|' read -r branch expected_sha tag_name expected_tree; do
            if git show-ref --verify --quiet "refs/tags/$tag_name"; then
              object_sha="$(git rev-parse "refs/tags/$tag_name")"
              [[ "$(git cat-file -t "$object_sha")" == 'tag' ]]
              [[ "$(git rev-parse "refs/tags/$tag_name^{}")" == "$expected_sha" ]]
              [[ "$(git rev-parse "$expected_sha^{tree}")" == "$expected_tree" ]]
              continue
            fi

            tag_message="$(mktemp)"
            cat >"$tag_message" <<EOF
          SOURCE_BRANCH = $branch
          SOURCE_COMMIT = $expected_sha
          SOURCE_TREE = $expected_tree
          ARCHIVE_CLASSIFICATION = DURABLE_INDEPENDENT_HISTORICAL_EVIDENCE
          IMMUTABLE_BY_PROJECT_POLICY = YES
          EOF
            git tag -a "$tag_name" "$expected_sha" -F "$tag_message"
            [[ "$(git cat-file -t "refs/tags/$tag_name")" == 'tag' ]]
            [[ "$(git rev-parse "refs/tags/$tag_name^{}")" == "$expected_sha" ]]
            push_refs+=("refs/tags/$tag_name:refs/tags/$tag_name")
          done <"$archive_ledger"

          if (( ${#push_refs[@]} > 0 )); then
            git push --atomic origin "${push_refs[@]}"
          fi

          while IFS='|' read -r branch expected_sha tag_name expected_tree; do
            git tag -d "$tag_name" >/dev/null 2>&1 || true
            git fetch origin "+refs/tags/$tag_name:refs/tags/$tag_name"
            object_sha="$(git rev-parse "refs/tags/$tag_name")"
            [[ "$(git cat-file -t "$object_sha")" == 'tag' ]]
            [[ "$(git rev-parse "refs/tags/$tag_name^{}")" == "$expected_sha" ]]
            [[ "$(git rev-parse "$expected_sha^{tree}")" == "$expected_tree" ]]
            tag_object="$(git cat-file -p "$object_sha")"
            grep -Fqx "SOURCE_BRANCH = $branch" <<<"$tag_object"
            grep -Fqx "SOURCE_COMMIT = $expected_sha" <<<"$tag_object"
            grep -Fqx "SOURCE_TREE = $expected_tree" <<<"$tag_object"
            grep -Fqx 'ARCHIVE_CLASSIFICATION = DURABLE_INDEPENDENT_HISTORICAL_EVIDENCE' <<<"$tag_object"
            grep -Fqx 'IMMUTABLE_BY_PROJECT_POLICY = YES' <<<"$tag_object"
            printf 'REMOTE_ARCHIVE_VERIFIED tag=%s object=%s commit=%s tree=%s\n' \
              "$tag_name" "$object_sha" "$expected_sha" "$expected_tree"
          done <"$archive_ledger"

      - name: Delete only exact bound branch refs atomically
        if: env.APPLY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune --force

          branch_ledger="$(mktemp)"
          cat >"$branch_ledger" <<'EOF'
          audit/main-tree-retirement-batch001-consumers|ea2c1017f5facc45e3ae093bbc1ccd982c9a40c7|DISPOSABLE||
          automation/main-tree-retirement-batch001-checkpoint-tag|ea3e87ead241eea2f6afdff56ce72411337bc169|ANCESTOR||
          continuity/v0.4.1-handoff-freeze|bead61a96f37394cde6f2407d9731cf8a191ef8a|ARCHIVE|archive/branch/continuity/v0.4.1-handoff-freeze|b3d1c9d176c8ad6499b03e49ec67ee69b5bbdaa5
          continuity/v0.5.0-c2-b-closure-freeze|af9f30b66d375ce06d82a98289d514a102aba5ed|ARCHIVE|archive/branch/continuity/v0.5.0-c2-b-closure-freeze|7e2568ccd1d7f068eec6221b1d897be4fe719496
          continuity/v0.5.0-c2-b-closure-freeze-check|e0d17a8edb8ce893983c68729d195ea2ac419153|ANCESTOR||
          continuity/v0.5.0-c2-b-closure-freeze-final|e0d17a8edb8ce893983c68729d195ea2ac419153|ANCESTOR||
          decision/post-hv4-sequencing|9aff26c1061edc872b343f57a6a766621e8694db|ANCESTOR||
          governance/hv4-acceptance|9867fc6d1f135602095157f3b568130b1deb08d6|DISPOSABLE||
          governance/hv5-acceptance|6529cc4ba9acf5ad76e6f23939fc4460c5afacf5|ANCESTOR||
          governance/hv5-implementation-authorization|2ae7dcefec4d499d6ba4bef462c8003945b40d0f|ANCESTOR||
          governance/hv5-preregistration-acceptance|57f6292f411c5fae656e0b097ef0e75f1eff30e7|ANCESTOR||
          governance/hv6-acceptance|6ad7c55a4e02a126d6d91f07847d76cfd33b8b8d|ANCESTOR||
          governance/hv6-implementation-authorization|2b67a2f4af4813e84bb539aa9136565dffb3fc1a|ANCESTOR||
          governance/hv6-native-phase-c-authorization|84e44fc54700e2102e1f826f2fb76791695bd15a|ANCESTOR||
          governance/hv6-preregistration-acceptance|dfd8dd477c11b5eaec8161cb2dfb2e61aec094d3|ANCESTOR||
          governance/main-tree-historical-artifact-retirement-policy|d069e76b971f64f7bea2434163e769bc9b1e678c|ANCESTOR||
          governance/main-tree-retirement-batch001-checkpoint-authorization|49dc1aadfb81c9d3e199c3dad1733794c46bb4a2|ANCESTOR||
          governance/main-tree-retirement-batch001-completion|eef5c6b8de9be3307fda4c4c9e21288b0fb46f98|ANCESTOR||
          governance/main-tree-retirement-batch001-docket|5753918b653e5ea4e860c29fd342252a934b40c3|ANCESTOR||
          governance/main-tree-retirement-batch001-execution-authorization|65b8479f188e5d181aa91f2775844002b45cb1d6|ANCESTOR||
          governance/post-hv3-sequencing-decision|20590dff2222a6dc855fabb9f0c4f8cb37cc2670|ANCESTOR||

          lease_args=()
          refspecs=()
          while IFS='|' read -r branch expected_sha class tag_name expected_tree; do
            [[ "$branch" != 'main' ]]
            remote_ref="refs/remotes/origin/$branch"
            [[ "$(git rev-parse "$remote_ref")" == "$expected_sha" ]] || {
              echo "Refusing deletion: branch-tip drift for $branch" >&2
              exit 1
            }
            lease_args+=("--force-with-lease=refs/heads/$branch:$expected_sha")
            refspecs+=(":refs/heads/$branch")
          done <"$branch_ledger"

          canonical_sha="$(git rev-parse refs/remotes/origin/main)"
          temp_ref="refs/remotes/origin/$TEMP_BRANCH"
          [[ "$(git rev-parse "$temp_ref")" == "$canonical_sha" ]] || {
            echo 'Refusing deletion: temporary capability branch drifted.' >&2
            exit 1
          }
          lease_args+=("--force-with-lease=refs/heads/$TEMP_BRANCH:$canonical_sha")
          refspecs+=(":refs/heads/$TEMP_BRANCH")

          git push --atomic "${lease_args[@]}" origin "${refspecs[@]}"

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune --force
          mapfile -t remaining < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin |
            grep -v '^HEAD$' |
            sort
          )
          [[ "$(printf '%s\n' "${remaining[@]}")" == 'main' ]] || {
            printf 'Refusing success: branch namespace not reduced to main.\n%s\n' \
              "$(printf '%s\n' "${remaining[@]}")" >&2
            exit 1
          }
          echo 'BOUND_BRANCH_DELETION=PASS'
          echo 'REMOTE_BRANCH_NAMESPACE=main-only'

  finalize-teardown-branch:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: custody
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out activation commit with authenticated Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Delete exact teardown branch only after canonical teardown
        shell: bash
        run: |
          set -euo pipefail

          activation_sha="${{ github.sha }}"
          [[ "$(git rev-parse "$activation_sha^")" == "$ACTIVATION_PARENT" ]]

          for attempt in $(seq 1 270); do
            git fetch origin '+refs/heads/main:refs/remotes/origin/main' --prune --force
            if git ls-remote --exit-code --heads origin "refs/heads/$TEARDOWN_BRANCH" >/dev/null 2>&1; then
              git fetch origin "+refs/heads/$TEARDOWN_BRANCH:refs/remotes/origin/$TEARDOWN_BRANCH" --force
              teardown_tip="$(git rev-parse "refs/remotes/origin/$TEARDOWN_BRANCH")"
              teardown_parent="$(git rev-parse "$teardown_tip^")"
              teardown_tree="$(git rev-parse "$teardown_tip^{tree}")"

              [[ "$teardown_parent" == "$activation_sha" ]] || {
                echo 'Refusing teardown-branch deletion: wrong parent.' >&2
                exit 1
              }
              [[ "$teardown_tree" == "$PRE_ACTIVATION_TREE" ]] || {
                echo 'Refusing teardown-branch deletion: wrong tree.' >&2
                exit 1
              }
              if git cat-file -e "$teardown_tip:$WORKFLOW_PATH" 2>/dev/null; then
                echo 'Refusing teardown-branch deletion: privileged workflow remains in teardown tip.' >&2
                exit 1
              fi

              canonical_sha="$(git rev-parse refs/remotes/origin/main)"
              if [[ "$canonical_sha" == "$teardown_tip" ]]; then
                git push \
                  "--force-with-lease=refs/heads/$TEARDOWN_BRANCH:$teardown_tip" \
                  origin \
                  ":refs/heads/$TEARDOWN_BRANCH"
                git fetch origin '+refs/heads/main:refs/remotes/origin/main' --prune --force
                [[ "$(git rev-parse refs/remotes/origin/main)" == "$teardown_tip" ]]
                if git ls-remote --exit-code --heads origin "refs/heads/$TEARDOWN_BRANCH" >/dev/null 2>&1; then
                  echo 'Refusing success: teardown branch still exists.' >&2
                  exit 1
                fi
                echo 'TEARDOWN_BRANCH_DELETION=PASS'
                echo 'NORMAL_MAIN_POSTURE_READY_FOR_EXTERNAL_VERIFICATION=YES'
                exit 0
              fi
            fi
            sleep 10
          done

          echo 'Timed out waiting for exact canonical teardown.' >&2
          exit 1

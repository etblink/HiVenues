name: Main-tree retirement Batch-001 checkpoint tag

on:
  pull_request:
    paths:
      - '.github/workflows/main-tree-retirement-batch001-checkpoint-tag.yml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/main-tree-retirement-batch001-checkpoint-tag.yml'

permissions:
  contents: write

jobs:
  checkpoint-tag:
    runs-on: ubuntu-latest
    env:
      APPLY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      RETIREMENT_ID: batch-20260830-001
      TAG_NAME: archive/main-tree/batch-20260830-001
      TARGET_COMMIT: 5753918b653e5ea4e860c29fd342252a934b40c3
      TARGET_TREE: fff9ab7827f66902bf2a3a6ea0273badd92805bf
      DOCKET_PATH: docs/MAIN_TREE_RETIREMENT_BATCH_001_DOCKET_0_1_0.md
      DOCKET_BLOB: f3954d477a9448b14bfa6557921ac5e72606073c
      AUTHORIZATION_COMMIT: 49dc1aadfb81c9d3e199c3dad1733794c46bb4a2
      AUTHORIZATION_PATH: docs/MAIN_TREE_RETIREMENT_BATCH_001_CHECKPOINT_AUTHORIZATION_0_1_0.md
      AUTHORIZATION_BLOB: 6ed21c5f89f0da9245a34d1d39aca0a14eba2c1b
    steps:
      - name: Check out event commit with authenticated Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Verify authorization, checkpoint, custody, and tag state
        id: preflight
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin '+refs/heads/main:refs/remotes/origin/main' '+refs/tags/*:refs/tags/*' --prune --force

          main_ref='refs/remotes/origin/main'
          event_sha="$(git rev-parse HEAD)"
          canonical_sha="$(git rev-parse "$main_ref")"

          printf 'EVENT_SHA=%s\n' "$event_sha"
          printf 'CANONICAL_MAIN=%s\n' "$canonical_sha"
          printf 'APPLY=%s\n' "$APPLY"

          if [[ "$APPLY" == 'true' && "$event_sha" != "$canonical_sha" ]]; then
            echo 'Refusing mutation: event commit is not exact canonical main.' >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$AUTHORIZATION_COMMIT" "$canonical_sha"; then
            echo 'Refusing operation: accepted checkpoint authorization is not an ancestor of canonical main.' >&2
            exit 1
          fi

          actual_auth_blob="$(git rev-parse "$canonical_sha:$AUTHORIZATION_PATH")"
          if [[ "$actual_auth_blob" != "$AUTHORIZATION_BLOB" ]]; then
            echo 'Refusing operation: checkpoint authorization record blob drifted.' >&2
            exit 1
          fi

          actual_target_tree="$(git rev-parse "$TARGET_COMMIT^{tree}")"
          if [[ "$actual_target_tree" != "$TARGET_TREE" ]]; then
            echo 'Refusing operation: authorized checkpoint tree mismatch.' >&2
            exit 1
          fi

          actual_docket_blob="$(git rev-parse "$TARGET_COMMIT:$DOCKET_PATH")"
          if [[ "$actual_docket_blob" != "$DOCKET_BLOB" ]]; then
            echo 'Refusing operation: retirement docket blob mismatch.' >&2
            exit 1
          fi

          candidates=(
            'docs/C2_C_1_WALLET_PRODUCT_IDENTITY_SPATIAL_REDESIGN.md|2ea7578d2832e82601de2c53787375d404fb3f99'
            'docs/C2_C_WALLET_SEMANTIC_REDESIGN.md|458149dbfcc2dfc4bb0c76ebdf6ee00c1a120953'
            'docs/C2_D_1_BETA_IMAGE_PIPELINE.md|8116d6b6bda99d5c8b2d15a23478cb80a696ff08'
            'docs/C2_E_MERCHANT_LOCAL_MODERATION.md|87a87ac5066d1a61aeea12cfa3faeb9a7ae4cc73'
            'docs/C2_F_ONBOARDING_DURABILITY_RECOVERY.md|9a0f92a4888fd7d7d2817d65b513d46874f7cae8'
            'docs/C2_G_1_PAYMENT_BACKUP_RESTORE.md|39a4fda4220cc0a0877b0d55df30184becf4ad53'
          )

          for entry in "${candidates[@]}"; do
            path="${entry%%|*}"
            expected_blob="${entry##*|}"
            actual_blob="$(git rev-parse "$TARGET_COMMIT:$path")"
            if [[ "$actual_blob" != "$expected_blob" ]]; then
              printf 'Refusing operation: archived candidate blob mismatch for %s.\n' "$path" >&2
              exit 1
            fi
            printf 'CUSTODY_OK path=%s blob=%s\n' "$path" "$actual_blob"
          done

          verify_tag() {
            local tag_ref="refs/tags/$TAG_NAME"
            local object_sha object_type peeled_commit peeled_tree tag_object

            object_sha="$(git rev-parse "$tag_ref")"
            object_type="$(git cat-file -t "$object_sha")"
            if [[ "$object_type" != 'tag' ]]; then
              echo 'Refusing operation: archive ref exists but is not an annotated tag object.' >&2
              exit 1
            fi

            peeled_commit="$(git rev-parse "$tag_ref^{}")"
            if [[ "$peeled_commit" != "$TARGET_COMMIT" ]]; then
              echo 'Refusing operation: annotated archive tag peels to the wrong commit.' >&2
              exit 1
            fi

            peeled_tree="$(git rev-parse "$peeled_commit^{tree}")"
            if [[ "$peeled_tree" != "$TARGET_TREE" ]]; then
              echo 'Refusing operation: annotated archive tag checkpoint tree mismatch.' >&2
              exit 1
            fi

            tag_object="$(git cat-file -p "$object_sha")"
            required_lines=(
              'RETIREMENT_ID = batch-20260830-001'
              'CHECKPOINT_COMMIT = 5753918b653e5ea4e860c29fd342252a934b40c3'
              'CHECKPOINT_TREE = fff9ab7827f66902bf2a3a6ea0273badd92805bf'
              'RETIREMENT_DOCKET_PATH = docs/MAIN_TREE_RETIREMENT_BATCH_001_DOCKET_0_1_0.md'
              'RETIREMENT_DOCKET_BLOB_SHA = f3954d477a9448b14bfa6557921ac5e72606073c'
              'CHECKPOINT_AUTHORIZATION_RECORD_PATH = docs/MAIN_TREE_RETIREMENT_BATCH_001_CHECKPOINT_AUTHORIZATION_0_1_0.md'
              'IMMUTABLE_BY_PROJECT_POLICY = YES'
            )

            for line in "${required_lines[@]}"; do
              if ! grep -Fqx "$line" <<<"$tag_object"; then
                printf 'Refusing operation: annotated tag is missing required annotation line: %s\n' "$line" >&2
                exit 1
              fi
            done

            if [[ "$(git rev-parse "$peeled_commit:$DOCKET_PATH")" != "$DOCKET_BLOB" ]]; then
              echo 'Refusing operation: archived docket recovery mismatch.' >&2
              exit 1
            fi

            for entry in "${candidates[@]}"; do
              path="${entry%%|*}"
              expected_blob="${entry##*|}"
              if [[ "$(git rev-parse "$peeled_commit:$path")" != "$expected_blob" ]]; then
                printf 'Refusing operation: archived recovery mismatch for %s.\n' "$path" >&2
                exit 1
              fi
            done

            printf 'TAG_OBJECT_SHA=%s\n' "$object_sha"
            printf 'TAG_OBJECT_TYPE=%s\n' "$object_type"
            printf 'TAG_PEELED_COMMIT=%s\n' "$peeled_commit"
            printf 'TAG_PEELED_TREE=%s\n' "$peeled_tree"
          }

          if git show-ref --verify --quiet "refs/tags/$TAG_NAME"; then
            echo 'TAG_STATE=EXISTS_VERIFYING'
            verify_tag
            echo 'tag_exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'TAG_STATE=ABSENT'
            echo 'tag_exists=false' >> "$GITHUB_OUTPUT"
          fi

          if [[ "$APPLY" != 'true' ]]; then
            echo 'DRY_RUN_ONLY=YES'
            echo 'NO_REFS_MUTATED=YES'
          fi

      - name: Create and push exact annotated checkpoint tag
        if: env.APPLY == 'true' && steps.preflight.outputs.tag_exists == 'false'
        shell: bash
        run: |
          set -euo pipefail

          tag_message="$(mktemp)"
          cat >"$tag_message" <<'EOF'
          RETIREMENT_ID = batch-20260830-001
          CHECKPOINT_COMMIT = 5753918b653e5ea4e860c29fd342252a934b40c3
          CHECKPOINT_TREE = fff9ab7827f66902bf2a3a6ea0273badd92805bf
          RETIREMENT_DOCKET_PATH = docs/MAIN_TREE_RETIREMENT_BATCH_001_DOCKET_0_1_0.md
          RETIREMENT_DOCKET_BLOB_SHA = f3954d477a9448b14bfa6557921ac5e72606073c
          CHECKPOINT_AUTHORIZATION_RECORD_PATH = docs/MAIN_TREE_RETIREMENT_BATCH_001_CHECKPOINT_AUTHORIZATION_0_1_0.md
          IMMUTABLE_BY_PROJECT_POLICY = YES
          EOF

          git config user.name 'Evan Kotler'
          git config user.email 'etblink@users.noreply.github.com'
          git tag -a "$TAG_NAME" "$TARGET_COMMIT" -F "$tag_message"

          if [[ "$(git cat-file -t "refs/tags/$TAG_NAME")" != 'tag' ]]; then
            echo 'Refusing push: locally created archive ref is not an annotated tag.' >&2
            exit 1
          fi
          if [[ "$(git rev-parse "refs/tags/$TAG_NAME^{}")" != "$TARGET_COMMIT" ]]; then
            echo 'Refusing push: locally created archive tag targets the wrong commit.' >&2
            exit 1
          fi

          git push origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME"

      - name: Re-fetch and verify remote annotated checkpoint
        if: env.APPLY == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git tag -d "$TAG_NAME" >/dev/null 2>&1 || true
          git fetch origin "+refs/tags/$TAG_NAME:refs/tags/$TAG_NAME" --force

          tag_ref="refs/tags/$TAG_NAME"
          object_sha="$(git rev-parse "$tag_ref")"
          object_type="$(git cat-file -t "$object_sha")"
          peeled_commit="$(git rev-parse "$tag_ref^{}")"
          peeled_tree="$(git rev-parse "$peeled_commit^{tree}")"

          [[ "$object_type" == 'tag' ]]
          [[ "$peeled_commit" == "$TARGET_COMMIT" ]]
          [[ "$peeled_tree" == "$TARGET_TREE" ]]
          [[ "$(git rev-parse "$peeled_commit:$DOCKET_PATH")" == "$DOCKET_BLOB" ]]

          tag_object="$(git cat-file -p "$object_sha")"
          required_lines=(
            'RETIREMENT_ID = batch-20260830-001'
            'CHECKPOINT_COMMIT = 5753918b653e5ea4e860c29fd342252a934b40c3'
            'CHECKPOINT_TREE = fff9ab7827f66902bf2a3a6ea0273badd92805bf'
            'RETIREMENT_DOCKET_PATH = docs/MAIN_TREE_RETIREMENT_BATCH_001_DOCKET_0_1_0.md'
            'RETIREMENT_DOCKET_BLOB_SHA = f3954d477a9448b14bfa6557921ac5e72606073c'
            'CHECKPOINT_AUTHORIZATION_RECORD_PATH = docs/MAIN_TREE_RETIREMENT_BATCH_001_CHECKPOINT_AUTHORIZATION_0_1_0.md'
            'IMMUTABLE_BY_PROJECT_POLICY = YES'
          )
          for line in "${required_lines[@]}"; do
            grep -Fqx "$line" <<<"$tag_object"
          done

          candidates=(
            'docs/C2_C_1_WALLET_PRODUCT_IDENTITY_SPATIAL_REDESIGN.md|2ea7578d2832e82601de2c53787375d404fb3f99'
            'docs/C2_C_WALLET_SEMANTIC_REDESIGN.md|458149dbfcc2dfc4bb0c76ebdf6ee00c1a120953'
            'docs/C2_D_1_BETA_IMAGE_PIPELINE.md|8116d6b6bda99d5c8b2d15a23478cb80a696ff08'
            'docs/C2_E_MERCHANT_LOCAL_MODERATION.md|87a87ac5066d1a61aeea12cfa3faeb9a7ae4cc73'
            'docs/C2_F_ONBOARDING_DURABILITY_RECOVERY.md|9a0f92a4888fd7d7d2817d65b513d46874f7cae8'
            'docs/C2_G_1_PAYMENT_BACKUP_RESTORE.md|39a4fda4220cc0a0877b0d55df30184becf4ad53'
          )
          for entry in "${candidates[@]}"; do
            path="${entry%%|*}"
            expected_blob="${entry##*|}"
            [[ "$(git rev-parse "$peeled_commit:$path")" == "$expected_blob" ]]
          done

          printf 'REMOTE_TAG_OBJECT_SHA=%s\n' "$object_sha"
          printf 'REMOTE_TAG_OBJECT_TYPE=%s\n' "$object_type"
          printf 'REMOTE_TAG_PEELED_COMMIT=%s\n' "$peeled_commit"
          printf 'REMOTE_TAG_PEELED_TREE=%s\n' "$peeled_tree"
          echo 'CHECKPOINT_TAG_CREATION_AND_VERIFICATION=PASS'
          echo 'FILE_DELETION_AUTHORIZED=NO'

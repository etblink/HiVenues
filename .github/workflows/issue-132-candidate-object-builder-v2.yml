name: Issue 132 candidate object builder v2

on:
  push:
    branches:
      - release/issue-132-turnkey-v1
    paths:
      - '.github/workflows/issue-132-candidate-object-builder-v2.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: issue-132-candidate-object-builder-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-object:
    name: Build unreferenced qualified candidate object
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact helper head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch exact qualified artifact through GitHub CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/9910454561" > /tmp/issue132-artifact-meta.json
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/9910454561/zip" > /tmp/issue132-qualified.zip
          printf '%s  %s\n' 'e48fb02f1773d8c9e0527b870074a8b9e2a7953cd1a27c98bb4929868c4a0b9e' '/tmp/issue132-qualified.zip' | sha256sum -c -
      - name: Build remote Git objects without moving a ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import tarfile
          import urllib.request
          import zipfile

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          helper_path = '.github/workflows/issue-132-candidate-object-builder-v2.yml'
          expected_artifact_head = 'da39f8326fb1aa1066582d7c0d6b093821d51751'
          expected_artifact_name = f'issue-132-gate-diagnostic-{expected_artifact_head}'
          expected_zip_sha256 = 'e48fb02f1773d8c9e0527b870074a8b9e2a7953cd1a27c98bb4929868c4a0b9e'
          expected_tar_sha256 = 'a6800b120eca95b418cb7f9432b2d1430eda59d8014bf0e8db2241aea1cc04ba'
          expected_paths_sha256 = 'a5407f9dc4389489ad19a3be6c53bd640e549d10d213ab7842bf040b20ddb28e'
          expected_status_sha256 = '9a271f2a916b0b6ee6cecb2426f0b3206ef074578be55d9bc94f6f3fe3ab86aa'

          def digest(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          def api(method, endpoint, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}{endpoint}',
                  data=data,
                  method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'issue-132-object-builder-v2',
                      **({'Content-Type': 'application/json'} if data is not None else {}),
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  raw = response.read()
                  return None if not raw else json.loads(raw.decode('utf-8'))

          meta = json.loads(Path('/tmp/issue132-artifact-meta.json').read_text(encoding='utf-8'))
          assert meta['expired'] is False, meta
          assert meta['name'] == expected_artifact_name, meta
          assert meta['workflow_run']['head_sha'] == expected_artifact_head, meta
          assert meta['digest'] == f'sha256:{expected_zip_sha256}', meta
          assert digest('/tmp/issue132-qualified.zip') == expected_zip_sha256

          extract_root = Path('/tmp/issue132-qualified')
          extract_root.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile('/tmp/issue132-qualified.zip') as archive:
              archive.extractall(extract_root)

          tar_path = extract_root / 'issue132-candidate-files.tar'
          paths_path = extract_root / 'issue132-changed-paths.txt'
          status_path = extract_root / 'issue132-check.status'
          assert digest(tar_path) == expected_tar_sha256
          assert digest(paths_path) == expected_paths_sha256
          assert digest(status_path) == expected_status_sha256
          assert status_path.read_text(encoding='utf-8').strip() == '0'

          changed_paths = paths_path.read_text(encoding='utf-8').splitlines()
          assert len(changed_paths) == 27
          assert changed_paths == sorted(changed_paths)
          assert len(set(changed_paths)) == len(changed_paths)
          assert all(path and not path.startswith('/') and '..' not in Path(path).parts for path in changed_paths)

          candidate_root = Path('/tmp/issue132-candidate')
          candidate_root.mkdir(parents=True, exist_ok=True)
          with tarfile.open(tar_path, 'r') as archive:
              archive.extractall(candidate_root)
          extracted_paths = sorted(str(path.relative_to(candidate_root)).replace('\\', '/') for path in candidate_root.rglob('*') if path.is_file())
          assert extracted_paths == changed_paths

          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          base_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          tree_entries = []
          blob_manifest = []
          for relative in changed_paths:
              encoded = base64.b64encode((candidate_root / relative).read_bytes()).decode('ascii')
              blob = api('POST', '/git/blobs', {'content': encoded, 'encoding': 'base64'})
              tree_entries.append({'path': relative, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
              blob_manifest.append({'path': relative, 'sha': blob['sha']})
          tree_entries.append({'path': helper_path, 'mode': '100644', 'type': 'blob', 'sha': None})

          tree = api('POST', '/git/trees', {'base_tree': base_tree, 'tree': tree_entries})
          commit = api('POST', '/git/commits', {
              'message': 'Finalize HiVenues current-facing branding',
              'tree': tree['sha'],
              'parents': [parent],
          })
          remote = api('GET', f"/git/commits/{commit['sha']}")
          assert remote['tree']['sha'] == tree['sha']
          assert [item['sha'] for item in remote['parents']] == [parent]

          result = {
              'candidate_commit': commit['sha'],
              'candidate_tree': tree['sha'],
              'parent': parent,
              'artifact_id': 9910454561,
              'artifact_head': expected_artifact_head,
              'artifact_digest': f'sha256:{expected_zip_sha256}',
              'candidate_tar_sha256': expected_tar_sha256,
              'changed_paths_sha256': expected_paths_sha256,
              'changed_paths': changed_paths,
              'blobs': blob_manifest,
              'helper_deleted_in_candidate': True,
              'ref_updated': False,
          }
          Path('/tmp/issue132-object-result.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(result, indent=2))
          PY
      - name: Preserve object-builder result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-132-candidate-object-${{ github.sha }}
          path: /tmp/issue132-object-result.json
          if-no-files-found: error
          retention-days: 30

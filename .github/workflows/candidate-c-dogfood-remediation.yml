name: Candidate C Dogfood Remediation Qualification

on:
  pull_request:
    paths:
      - 'src/candidate-c/**'
      - 'views/candidate-c/**'
      - 'public/css/candidate-c*.css'
      - 'public/js/candidate-c-studio.js'
      - 'scripts/candidate-c-guided-creator-operator.js'
      - 'scripts/candidate-c-dogfood-remediation-browser-v2.js'
      - 'scripts/candidate-c-dogfood-remediation-lifecycle-browser.js'
      - 'test/candidate-c-dogfood-remediation.test.js'
      - '.github/workflows/candidate-c-dogfood-remediation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-c-dogfood-remediation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Real-host authoring loop qualification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify exact runtime provenance
        run: npm run release:check:runtime
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Run bounded remediation contracts
        run: node --test --test-concurrency=1 test/candidate-c-dogfood-remediation.test.js test/candidate-c-phase2b-h1.test.js
      - name: Install pinned Chromium runtime
        run: npx --no-install playwright install --with-deps chromium
      - name: Acquire exact archived Fourth Street inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qualification-source
          curl --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/etblink/Hive-Bar/fdb5b5b1436c9e41b5869c7ba3bd1f6a92f9165e/public/images/fourth-street-bar-exterior.jpg' \
            --output .qualification-source/fourth-street-bar-exterior.jpg
          curl --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/etblink/Hive-Bar/fdb5b5b1436c9e41b5869c7ba3bd1f6a92f9165e/public/images/fourth-street-bar-logo.jpg' \
            --output .qualification-source/fourth-street-bar-logo.jpg
          echo '585b3e80a50723b3cd0209b244f3a57efb14c018313f64ea34bd7f3108bc654a  .qualification-source/fourth-street-bar-exterior.jpg' | sha256sum --check --strict
          echo 'c57379e4dc46a367879fc0dc67b61b5514ede4fd795cfbbc0ea116914cea91da  .qualification-source/fourth-street-bar-logo.jpg' | sha256sum --check --strict
      - name: Run Chromium real Fourth Street authoring qualification
        env:
          CANDIDATE_C_DOGFOOD_REMEDIATION_ROOT: artifacts/candidate-c-dogfood-remediation
          CANDIDATE_C_DOGFOOD_REMEDIATION_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FOURTH_STREET_EXTERIOR_IMAGE: .qualification-source/fourth-street-bar-exterior.jpg
          FOURTH_STREET_LOGO_IMAGE: .qualification-source/fourth-street-bar-logo.jpg
        run: node scripts/candidate-c-dogfood-remediation-browser-v2.js
      - name: Run Chromium synthetic add-Release-urgent lifecycle qualification
        env:
          CANDIDATE_C_DOGFOOD_LIFECYCLE_ROOT: artifacts/candidate-c-dogfood-remediation-lifecycle
          CANDIDATE_C_DOGFOOD_REMEDIATION_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/candidate-c-dogfood-remediation-lifecycle-browser.js
      - name: Publish dogfood remediation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-c-dogfood-remediation-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/candidate-c-dogfood-remediation
            artifacts/candidate-c-dogfood-remediation-lifecycle
          if-no-files-found: warn
          retention-days: 90
      - name: Summarize dogfood remediation evidence
        if: success()
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('artifacts/candidate-c-dogfood-remediation/manifest.json', 'utf8'));
          const lifecycle = JSON.parse(fs.readFileSync('artifacts/candidate-c-dogfood-remediation-lifecycle/manifest.json', 'utf8'));
          console.log('## Candidate C dogfood remediation qualification');
          console.log('');
          console.log(`- Exact candidate: ${manifest.candidate}`);
          console.log(`- Archived source: ${manifest.source.repository}@${manifest.source.commit}`);
          console.log(`- Fourth Street screenshots: ${manifest.summary.screenshotCount}`);
          console.log(`- Blocking accessibility findings: ${manifest.summary.blockingAccessibilityFindings}`);
          console.log(`- Horizontal overflow findings: ${manifest.summary.horizontalOverflowFindings}`);
          console.log(`- Incomplete images: ${manifest.summary.incompleteImageFindings}`);
          console.log(`- External product requests: ${manifest.summary.externalRequests}`);
          console.log(`- Unexpected console/page errors: ${manifest.summary.unexpectedConsoleErrors}`);
          console.log(`- Fourth Street activities invented: ${manifest.proof.activityCount}`);
          console.log(`- Real exterior SHA-256: ${manifest.proof.hero.sha256}`);
          console.log(`- Official logo SHA-256: ${manifest.proof.logo.sha256}`);
          console.log(`- Draft isolation: ${manifest.proof.draftIsolation}`);
          console.log(`- Restart persistence: ${manifest.proof.restartPersisted}`);
          console.log(`- Hive RPC/writes: ${manifest.proof.external.hiveRpcAttempts}/${manifest.proof.external.hiveWrites}`);
          console.log(`- Provider/payment/signing/deployment effects: ${manifest.proof.external.providerWrites}/${manifest.proof.external.payments}/${manifest.proof.external.signingAttempts}/${manifest.proof.external.deployments}`);
          console.log('');
          console.log('### Synthetic lifecycle closure');
          console.log(`- Synthetic fixture declared: ${lifecycle.fixture.synthetic}`);
          console.log(`- Screenshots: ${lifecycle.summary.screenshotCount}`);
          console.log(`- Started with Activities: ${lifecycle.proof.initialActivityCount}`);
          console.log(`- Added Activity: ${lifecycle.proof.createdActivityTitle}`);
          console.log(`- Full Release: ${lifecycle.proof.fullReleaseId}`);
          console.log(`- Urgent Release: ${lifecycle.proof.urgentReleaseId}`);
          console.log(`- Unpublished draft paths at review: ${lifecycle.proof.unpublishedDraftPathsAtReview.join(', ')}`);
          console.log(`- Unpublished draft preserved: ${lifecycle.proof.unpublishedDraftPreservedAfterUrgent}`);
          console.log(`- Unpublished draft absent from live: ${lifecycle.proof.unpublishedDraftAbsentFromLive}`);
          console.log(`- Restart persistence: ${lifecycle.proof.restartPersisted}`);
          console.log(`- Lifecycle external requests: ${lifecycle.summary.externalRequests}`);
          console.log(`- Lifecycle blocking accessibility findings: ${lifecycle.summary.blockingAccessibilityFindings}`);
          console.log(`- Lifecycle horizontal overflow findings: ${lifecycle.summary.horizontalOverflowFindings}`);
          console.log(`- Lifecycle external effects: ${JSON.stringify(lifecycle.proof.external)}`);
          NODE

name: Issue 132 package-lock metadata repair

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair-lock-metadata:
    name: Repair v1 package-lock metadata for candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Copy exact package identity into unchanged dependency lock
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (!lock.packages || !lock.packages['']) throw new Error('package-lock root package entry missing');
          lock.name = pkg.name;
          lock.version = pkg.version;
          lock.packages[''].name = pkg.name;
          lock.packages[''].version = pkg.version;
          fs.writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);
          NODE
      - name: Upload exact repaired bytes as an unreferenced Git blob
        id: blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node - <<'NODE' > blob-request.json
          const fs = require('node:fs');
          process.stdout.write(JSON.stringify({
            content: fs.readFileSync('package-lock.json').toString('base64'),
            encoding: 'base64',
          }));
          NODE
          sha="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input blob-request.json --jq .sha)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_LOCK_BLOB_SHA=$sha"
      - name: Preserve repaired lock and blob identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-132-package-lock-${{ github.event.pull_request.head.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7

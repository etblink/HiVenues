name: Issue 132 deterministic gate diagnostic

on:
  push:
    branches:
      - release/issue-132-turnkey-v1
    paths:
      - '.github/workflows/issue-132-gate-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: issue-132-gate-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Reproduce Issue 132 full-gate failure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact diagnostic head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify exact runtime provenance
        run: npm run release:check:runtime
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Reproduce bounded current-UI repair in runner only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYRUN'
          from pathlib import Path

          workflow = Path('.github/workflows/issue-132-branding-repair.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          lines = workflow[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(code, 'issue-132-branding-repair-inline.py', 'exec'), {})
          PYRUN
      - name: Re-run bounded name proof and targeted regressions
        shell: bash
        run: |
          set -euo pipefail
          npm run release:check:name
          if grep -RInE '\b(Hive-Bar|Hive[ -]Venues)\b' views src/venue/source-authoring-surface.js src/venue/reference/source-authoring-surface-core.js; then
            echo 'Stale current-facing product name remains.' >&2
            exit 1
          fi
          node --test test/venue-source-authoring-surface.test.js test/hv7-juniper-rendering.test.js test/turnkey-release.test.js
      - name: Run complete deterministic quality gate and collect report
        id: full_gate
        shell: bash
        run: |
          set -uo pipefail
          set +e
          npm run check 2>&1 | tee /tmp/issue132-check.log
          status=${PIPESTATUS[0]}
          set -e

          printf '%s\n' "$status" > /tmp/issue132-check.status
          {
            echo "ISSUE132_FULL_CHECK_EXIT=${status}"
            echo '===== ISSUE132_FULL_GATE_FAILURE_DIGEST_BEGIN ====='
            grep -nE 'not ok|AssertionError|ERR_ASSERTION|npm error|Error:|FAILED|FAIL|eslint|HiVenues release-name audit failed|expected|actual|mismatch|stale|forbidden|missing' /tmp/issue132-check.log | head -n 180 || true
            echo '===== ISSUE132_FULL_GATE_TAIL_BEGIN ====='
            tail -n 220 /tmp/issue132-check.log || true
            echo '===== ISSUE132_FULL_GATE_FAILURE_DIGEST_END ====='
          } > /tmp/issue132-diagnostic.txt

          cat /tmp/issue132-diagnostic.txt
          exit 0
      - name: Preserve compact diagnostic report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-132-gate-diagnostic-${{ github.sha }}
          path: |
            /tmp/issue132-diagnostic.txt
            /tmp/issue132-check.status
          if-no-files-found: error
          retention-days: 30
      - name: Preserve full-gate failure semantics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f /tmp/issue132-check.status ]]; then
            echo 'Diagnostic did not reach the full deterministic gate.' >&2
            exit 2
          fi
          status="$(cat /tmp/issue132-check.status)"
          if [[ "$status" != "0" ]]; then
            echo "Issue 132 runner-only branding repair full gate failed with exit ${status}." >&2
            exit "$status"
          fi

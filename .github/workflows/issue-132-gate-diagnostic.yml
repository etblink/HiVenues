name: Issue 132 deterministic gate diagnostic

on:
  push:
    branches: [release/issue-132-turnkey-v1]
    paths: ['.github/workflows/issue-132-gate-diagnostic.yml']

permissions:
  contents: read

concurrency:
  group: issue-132-gate-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm run release:check:runtime
      - run: npm ci --ignore-scripts --no-fund
      - name: Build final bounded branding candidate in runner only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          product_pattern = re.compile(r'\b(?:Hive-Bar|Hive[ -]Venues)\b')
          current_sources = sorted(Path('views').rglob('*.ejs')) + [
              Path('src/venue/source-authoring-surface.js'),
              Path('src/venue/reference/source-authoring-surface-core.js'),
              Path('scripts/capture-issue-130-presentation-review.js'),
              Path('scripts/capture-issue-132-turnkey-visual.js'),
              Path('test/support/hv7-juniper-venue.js'),
          ]
          exact_test_phrases = {
              'decrypted message is not sent back to Hive-Venues': 'decrypted message is not sent back to HiVenues',
              'Hive-Venues cannot move funds or access private keys': 'HiVenues cannot move funds or access private keys',
              'Hive-Venues checks your current rewards again before Keychain asks for approval': 'HiVenues checks your current rewards again before Keychain asks for approval',
              'Hive-Venues does not control or guarantee transaction recognition, rebate amount, claim processing, or payout': 'HiVenues does not control or guarantee transaction recognition, rebate amount, claim processing, or payout',
              'Built with Hive-Venues': 'Built with HiVenues',
              '4th Street Bar does not currently offer payments through Hive-Venues': '4th Street Bar does not currently offer payments through HiVenues',
              'Juniper Works Cooperative does not currently offer payments through Hive-Venues': 'Juniper Works Cooperative does not currently offer payments through HiVenues',
              'Keychain approval can happen before Hive-Venues sees final confirmation': 'Keychain approval can happen before HiVenues sees final confirmation',
              'Hive-Venues checks the payment and shows you exactly what will be sent': 'HiVenues checks the payment and shows you exactly what will be sent',
              'Hive-Venues receives only the four public keys': 'HiVenues receives only the four public keys',
              'Hive-Venues never asks for or stores private keys': 'HiVenues never asks for or stores private keys',
              'Hive-Venues never receives your private keys': 'HiVenues never receives your private keys',
              'Hive-Venues reloads your current profile so unrelated settings from other apps stay intact': 'HiVenues reloads your current profile so unrelated settings from other apps stay intact',
              'Hive-Venues removes the recovery download': 'HiVenues removes the recovery download',
          }

          changed = []
          def write_if_changed(path, after):
              before = path.read_text(encoding='utf-8')
              if after != before:
                  path.write_text(after, encoding='utf-8', newline='\n')
                  changed.append(path.as_posix())

          for path in current_sources:
              if path.is_file():
                  before = path.read_text(encoding='utf-8')
                  write_if_changed(path, product_pattern.sub('HiVenues', before))

          for path in sorted(Path('test').rglob('*.js')):
              before = path.read_text(encoding='utf-8')
              after = before
              for old, new in exact_test_phrases.items():
                  after = after.replace(old, new)
              if path.as_posix() in {'test/hv7-juniper-rendering.test.js', 'test/venue-package.test.js'}:
                  after = after.replace('Hive-Venues', 'HiVenues')
              write_if_changed(path, after)

          changed = sorted(set(changed))
          Path('/tmp/issue132-changed-paths.txt').write_text('\n'.join(changed) + '\n', encoding='utf-8')
          print('ISSUE132_CANDIDATE_CHANGED_PATHS=' + str(len(changed)))
          for path in changed:
              print(path)
          PY
          tar -cf /tmp/issue132-candidate-files.tar -T /tmp/issue132-changed-paths.txt
      - name: Prove current-facing name boundary
        shell: bash
        run: |
          set -euo pipefail
          npm run release:check:name
          if grep -RInE '\b(Hive-Bar|Hive[ -]Venues)\b' views src/venue/source-authoring-surface.js src/venue/reference/source-authoring-surface-core.js scripts/capture-issue-130-presentation-review.js scripts/capture-issue-132-turnkey-visual.js test/support/hv7-juniper-venue.js; then
            echo 'Stale current-facing product name remains.' >&2
            exit 1
          fi
      - name: Run complete deterministic quality gate
        shell: bash
        run: |
          set -uo pipefail
          set +e
          npm run check 2>&1 | tee /tmp/issue132-check.log
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > /tmp/issue132-check.status
          exit 0
      - name: Preserve candidate and full report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-132-gate-diagnostic-${{ github.sha }}
          path: |
            /tmp/issue132-check.log
            /tmp/issue132-check.status
            /tmp/issue132-changed-paths.txt
            /tmp/issue132-candidate-files.tar
          if-no-files-found: error
          retention-days: 30
      - name: Preserve full-gate semantics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status="$(cat /tmp/issue132-check.status 2>/dev/null || echo 2)"
          test "$status" = 0

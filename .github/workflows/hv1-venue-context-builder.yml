name: HV-1 venue context builder

on:
  push:
    branches:
      - automation/hv1-venue-context-builder

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: automation/hv1-venue-context-builder
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: platform/hv1-venue-context-foundation
          path: candidate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: candidate/.nvmrc
          package-manager-cache: false
      - name: Build and qualify candidate
        working-directory: candidate
        run: |
          node ../automation/tools/hv1-build-candidate.js
          node ../automation/tools/hv1-build-repair.js
          node ../automation/tools/hv1-build-repair-v2.js
          npm run release:check:runtime
          npm ci --ignore-scripts --no-fund
          npx --no-install patch-package
          npm run check
          npm run test:coverage
          node --test test/venue-context.test.js
      - name: Guard high-risk paths
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          ! git grep -nEi 'fourthstreetbar|fourthst\.threads|hive-108590|1114 E\. 4th Street|4thstreetbarreno\.com' -- src/app.js routes/index.js
          if git diff --name-only HEAD | grep -E '^(.github/workflows|src/hive/operations|src/payments/payment-observer|src/payments/receipt-store|src/onboarding/transactions)'; then
            exit 1
          fi
      - name: Publish qualified candidate branch
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Hive-Venues Project Lead Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/config.js src/app.js routes/index.js src/venue test/venue-context.test.js test/ux-1f-homepage.test.js
          git diff --cached --check
          git commit -m 'Establish explicit venue context foundation'
          git push origin HEAD:platform/hv1-venue-context-foundation
          git rev-parse HEAD
          git rev-parse HEAD^{tree}

# exact-blob-audited retry
name: Project Lead Apply Candidate C r3

on:
  push:
    branches:
      - candidate-c/phase2b-ef-fable
    paths:
      - .github/workflows/project-lead-apply-r3.yml

permissions:
  contents: write

jobs:
  apply-exact-r3-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout continuation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: candidate-c/phase2b-ef-fable
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and publish exact Project Lead r3 tree
        shell: bash
        run: |
          set -euo pipefail

          D_FREEZE=3083ef2f1e35ec1517157a3141c1c5df33da8aff
          EXPECTED_TREE=954e988c3252f87e5fa17bb2598c6ac2ffadf829
          EXPECTED_GZIP_SHA=949f0526577e0e8d020d8087fa99ba9d8c955d9505fb9711941be50eafbd2895
          EXPECTED_PATCH_SHA=aa86e7065614575bcc3ec54903b60fad77196fbfa1f3a82a97c6306f604eaa1b

          git merge-base --is-ancestor "$D_FREEZE" HEAD

          unexpected="$(git diff --name-only "$D_FREEZE" HEAD -- . \
            ':(exclude)project-lead-r3/**' \
            ':(exclude).github/workflows/project-lead-apply-r3.yml')"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected pre-apply branch changes:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

          cat project-lead-r3/patch.part* > /tmp/r3.patch.gz.b64
          base64 --decode /tmp/r3.patch.gz.b64 > /tmp/r3.patch.gz
          test "$(sha256sum /tmp/r3.patch.gz | awk '{print $1}')" = "$EXPECTED_GZIP_SHA"

          gzip -dc /tmp/r3.patch.gz > /tmp/r3.patch
          test "$(sha256sum /tmp/r3.patch | awk '{print $1}')" = "$EXPECTED_PATCH_SHA"

          git apply --check /tmp/r3.patch
          git apply /tmp/r3.patch

          rm -rf project-lead-r3
          rm .github/workflows/project-lead-apply-r3.yml
          git add -A

          tree="$(git write-tree)"
          echo "candidate_tree=$tree"
          test "$tree" = "$EXPECTED_TREE"

          git config user.name 'HiVenues Project Lead'
          git config user.email '30190328+etblink@users.noreply.github.com'
          git commit -m 'Candidate C 2B: publish Project Lead r3 exact tree'
          git push origin HEAD:candidate-c/phase2b-ef-fable

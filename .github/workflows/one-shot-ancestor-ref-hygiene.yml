name: One-shot ancestor ref hygiene

on:
  pull_request:
    paths:
      - .github/workflows/one-shot-ancestor-ref-hygiene.yml
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-ancestor-ref-hygiene.yml

permissions:
  contents: write

concurrency:
  group: ancestor-ref-hygiene-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify-and-clean:
    name: Classify ancestor refs and clean only on main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact event commit with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Classify remote branch refs by canonical ancestry
        shell: bash
        env:
          APPLY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          main_ref='refs/remotes/origin/main'
          event_sha="$(git rev-parse HEAD)"
          canonical_sha="$(git rev-parse "$main_ref")"

          if [[ "$APPLY" == 'true' && "$event_sha" != "$canonical_sha" ]]; then
            echo "Refusing mutation: event commit is not exact canonical main." >&2
            exit 1
          fi

          mapfile -t branches < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin |
              LC_ALL=C sort
          )

          deletable=()
          retained_policy=()
          retained_divergent=()

          for branch in "${branches[@]}"; do
            [[ -z "$branch" ]] && continue
            case "$branch" in
              HEAD|main)
                retained_policy+=("$branch")
                continue
                ;;
              continuity/*)
                retained_policy+=("$branch")
                continue
                ;;
            esac

            remote_ref="refs/remotes/origin/$branch"
            if git merge-base --is-ancestor "$remote_ref" "$main_ref"; then
              deletable+=("$branch")
            else
              retained_divergent+=("$branch")
            fi
          done

          printf 'Canonical main: %s\n' "$canonical_sha"
          printf 'Remote branches observed: %d\n' "${#branches[@]}"
          printf 'Policy-retained refs: %d\n' "${#retained_policy[@]}"
          printf 'Divergent refs retained: %d\n' "${#retained_divergent[@]}"
          printf 'Canonical-ancestor refs eligible for deletion: %d\n' "${#deletable[@]}"

          printf '\nPOLICY_RETAINED\n'
          printf '%s\n' "${retained_policy[@]}"
          printf '\nDIVERGENT_RETAINED\n'
          printf '%s\n' "${retained_divergent[@]}"
          printf '\nANCESTOR_DELETE_SET\n'
          printf '%s\n' "${deletable[@]}"

          {
            echo '## One-shot ancestor ref hygiene'
            echo
            echo "- canonical main: \`$canonical_sha\`"
            echo "- remote branches observed: ${#branches[@]}"
            echo "- policy-retained refs: ${#retained_policy[@]}"
            echo "- divergent refs retained: ${#retained_divergent[@]}"
            echo "- canonical-ancestor refs eligible for deletion: ${#deletable[@]}"
            echo "- mutation enabled: \`$APPLY\`"
            echo
            echo '### Ancestor delete set'
            printf -- '- `%s`\n' "${deletable[@]}"
            echo
            echo '### Divergent refs retained'
            printf -- '- `%s`\n' "${retained_divergent[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$APPLY" != 'true' ]]; then
            echo 'Dry run only: no refs mutated.'
            exit 0
          fi

          for branch in "${deletable[@]}"; do
            echo "Deleting canonical-ancestor ref: $branch"
            git push origin --delete "$branch"
          done

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          remaining="$(git for-each-ref --count=1000 --format='%(refname:strip=3)' refs/remotes/origin | grep -Ev '^(HEAD)?$' | wc -l | tr -d ' ')"
          echo "Remaining remote branch refs after cleanup: $remaining"
          echo "- remaining remote branch refs after cleanup: $remaining" >> "$GITHUB_STEP_SUMMARY"

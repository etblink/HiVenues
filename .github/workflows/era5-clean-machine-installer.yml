name: Era 5 clean-machine installer

on:
  pull_request:
    paths:
      - 'src/**'
      - 'views/**'
      - 'public/**'
      - 'native/windows/**'
      - 'installer/windows/**'
      - 'scripts/hivenues-installed.js'
      - 'scripts/era5/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/era5-clean-machine-installer.yml'
      - 'docs/HIVENUES_ERA5_WINDOWS_INSTALLER_0_1_0.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    name: Build Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify exact runtime provenance
        run: npm run release:check:runtime

      - name: Resolve exact source identity
        id: source
        shell: pwsh
        run: |
          "tree=$(git rev-parse 'HEAD^{tree}')" >> $env:GITHUB_OUTPUT

      - name: Build native Windows launcher
        shell: pwsh
        run: |
          ./scripts/era5/build-windows-launcher.ps1 -Output "$env:RUNNER_TEMP\launcher\HiVenues Studio.exe"

      - name: Build Windows bundle
        shell: pwsh
        run: |
          node scripts/era5/build-windows-bundle.js --output "$env:RUNNER_TEMP\bundle" --source-sha "${{ github.event.pull_request.head.sha || github.sha }}" --source-tree "${{ steps.source.outputs.tree }}" --launcher "$env:RUNNER_TEMP\launcher\HiVenues Studio.exe"

      - name: Install pinned NSIS build dependency
        shell: pwsh
        run: |
          choco install nsis --version=3.12.0 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey NSIS install failed with exit code $LASTEXITCODE." }

      - name: Build per-user installer
        shell: pwsh
        run: |
          ./scripts/era5/build-windows-installer.ps1 -BundleRoot "$env:RUNNER_TEMP\bundle" -OutputDirectory "$env:RUNNER_TEMP\installer"

      - name: Stage clean-machine qualification script
        shell: pwsh
        run: |
          Copy-Item -LiteralPath "./scripts/era5/qualify-clean-machine.ps1" -Destination "$env:RUNNER_TEMP\installer\qualify-clean-machine.ps1"

      - name: Upload installer qualification package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hivenues-clean-machine-installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}\installer\*.exe
            ${{ runner.temp }}\installer\*.sha256
            ${{ runner.temp }}\installer\*.provenance.json
            ${{ runner.temp }}\installer\qualify-clean-machine.ps1
          if-no-files-found: error
          retention-days: 14

  clean-machine:
    name: Qualify install/update/uninstall on fresh Windows runner
    needs: build-installer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download exact installer qualification package
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: hivenues-clean-machine-installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\qualification

      - name: Qualify clean-machine product lifecycle
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\qualification\qualify-clean-machine.ps1" -ArtifactRoot "$env:RUNNER_TEMP\qualification" -EvidenceOutput "$env:RUNNER_TEMP\clean-machine-evidence"

      - name: Upload clean-machine evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hivenues-clean-machine-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\clean-machine-evidence
          if-no-files-found: warn
          retention-days: 14

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify qualification scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      visual: ${{ steps.classify.outputs.visual }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        # Policy lives in the executable below: visual=false unless a trigger matches;
        # workflow_dispatch always selects visual=true. Existing trigger examples include
        # views/*|public/*|src/input.css, scripts/capture-*-visual.js, and
        # src/venue/source-authoring-surface.js and test/turnkey-release.test.js.
        # Git-fixture tests verify actual selection for these documented examples.
        run: node scripts/classify-qualification-scope.js

  verify:
    name: Node 24.19.0 / npm 11.17.0 verification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify exact runtime provenance
        run: npm run release:check:runtime
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Run deterministic quality gate
        run: npm run check:deterministic

  security-audit:
    name: Production dependency audit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify exact runtime provenance
        run: npm run release:check:runtime
      - name: Run bounded production dependency audit
        run: npm run audit:prod:ci

  visual-acceptance:
    name: UI/UX current-contract evidence (Ubuntu / pinned Chromium)
    needs:
      - scope
      - verify
    if: needs.scope.outputs.visual == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify exact runtime provenance
        run: npm run release:check:runtime
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Install pinned Chromium runtime
        run: npx --no-install playwright install --with-deps chromium
      - name: Qualify onboarding browser modules
        run: npm run test:browser:m19-3-1
      - name: Build exact presentation assets once
        run: npm run build
      - name: Run current visual machine contract with bounded concurrency
        env:
          VISUAL_RAW_ROOT: artifacts/raw-visual
          VISUAL_MAX_CONCURRENCY: '3'
        run: node scripts/run-current-visual-contract.js
      - name: Capture faithful current viewport review evidence
        env:
          VISUAL_REVIEW_ROOT: artifacts/current-visual-review
        run: node scripts/capture-current-contract-visual.js
      - name: Capture Issue 130 presentation review evidence
        env:
          ISSUE_130_PRESENTATION_REVIEW_ROOT: artifacts/issue-130-presentation-review
        run: node scripts/capture-issue-130-presentation-review.js
      - name: Capture Issue 132 turnkey Track A and Track B evidence
        env:
          ISSUE_132_TURNKEY_REVIEW_ROOT: artifacts/issue-132-turnkey-review
        run: node scripts/capture-issue-132-turnkey-visual.js
      - name: Capture PM3 v2 renderer reference evidence
        env:
          V2_RENDERER_REVIEW_ROOT: artifacts/v2-renderer-review
        run: node scripts/capture-v2-renderer-visual.js
      - name: Capture PM3 read-only v2 Studio page-context evidence
        env:
          V2_STUDIO_REVIEW_ROOT: artifacts/v2-studio-review
        run: node scripts/capture-v2-studio-visual.js
      - name: Capture PM3 v2 authoring transaction evidence
        env:
          V2_AUTHORING_REVIEW_ROOT: artifacts/v2-authoring-review
        run: node scripts/capture-v2-authoring-visual.js
      - name: Capture PM3 v2 component reorder evidence
        env:
          V2_REORDER_REVIEW_ROOT: artifacts/v2-component-reorder-review
        run: node scripts/capture-v2-component-reorder-visual.js
      - name: Capture PM3 v2 component cardinality evidence
        env:
          V2_CARDINALITY_REVIEW_ROOT: artifacts/v2-component-cardinality-review
        run: node scripts/capture-v2-component-cardinality-visual.js
      - name: Capture PM3 v2 semantic Theme authoring evidence
        env:
          V2_THEME_REVIEW_ROOT: artifacts/v2-theme-authoring-review
        run: node scripts/capture-v2-theme-authoring-visual.js
      - name: Assemble bounded human-review evidence
        env:
          VISUAL_RAW_ROOT: artifacts/raw-visual
          VISUAL_REVIEW_ROOT: artifacts/current-visual-review
        run: node scripts/assemble-current-visual-evidence.js
      - name: Publish visual-contract metrics
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const machine = JSON.parse(fs.readFileSync('artifacts/current-visual-machine-summary.json', 'utf8'));
          const review = JSON.parse(fs.readFileSync('artifacts/current-visual-review/manifest.json', 'utf8'));
          const presentation = JSON.parse(fs.readFileSync('artifacts/issue-130-presentation-review/manifest.json', 'utf8'));
          const turnkey = JSON.parse(fs.readFileSync('artifacts/issue-132-turnkey-review/manifest.json', 'utf8'));
          const v2Renderer = JSON.parse(fs.readFileSync('artifacts/v2-renderer-review/manifest.json', 'utf8'));
          const v2Studio = JSON.parse(fs.readFileSync('artifacts/v2-studio-review/manifest.json', 'utf8'));
          const v2Authoring = JSON.parse(fs.readFileSync('artifacts/v2-authoring-review/manifest.json', 'utf8'));
          const v2Reorder = JSON.parse(fs.readFileSync('artifacts/v2-component-reorder-review/manifest.json', 'utf8'));
          const v2Cardinality = JSON.parse(fs.readFileSync('artifacts/v2-component-cardinality-review/manifest.json', 'utf8'));
          const v2Theme = JSON.parse(fs.readFileSync('artifacts/v2-theme-authoring-review/manifest.json', 'utf8'));
          console.log('## Current visual qualification contract');
          console.log('');
          console.log(`- Machine suites: ${machine.suites.length}`);
          console.log(`- Bounded-concurrency machine wall time: ${machine.wallSeconds}s (CI #508 serial baseline: ~${machine.baselineVisualWallSecondsApprox}s)`);
          console.log(`- Human-review screenshots: ${review.reviewMetrics.screenshotCount} (CI #508 uploaded PNG baseline: ${review.baseline.pngCount})`);
          console.log(`- Human-review PNG bytes: ${review.reviewMetrics.screenshotBytes} (CI #508 artifact baseline: ${review.baseline.uploadedBytes} bytes)`);
          console.log(`- Issue #130 presentation-review screenshots: ${presentation.captures.length}`);
          console.log(`- Issue #132 Track A Studio screenshots: ${turnkey.tracks.A.screenshots.length}`);
          console.log(`- Issue #132 Track B generated-output screenshots: ${turnkey.tracks.B.screenshots.length}`);
          console.log(`- Issue #171 v2 renderer references: ${v2Renderer.summary.referenceCount}; screenshots: ${v2Renderer.summary.screenshotCount}`);
          console.log(`- Issue #171 blocking accessibility findings: ${v2Renderer.summary.blockingAccessibilityFindings}; horizontal-overflow findings: ${v2Renderer.summary.horizontalOverflowFindings}`);
          console.log(`- Issue #177 read-only Studio references: ${v2Studio.summary.referenceCount}; screenshots: ${v2Studio.summary.screenshotCount}`);
          console.log(`- Issue #177 direct-inspection captures: ${v2Studio.summary.directInspectionCaptures}; keyboard-inspection captures: ${v2Studio.summary.keyboardInspectionCaptures}; browse-preview captures: ${v2Studio.summary.browsePreviewCaptures}`);
          console.log(`- Issue #177 page-adoption captures: ${v2Studio.summary.pageAdoptionCaptures}; post-adoption inspections: ${v2Studio.summary.postAdoptionInspectionCaptures}; same-page checks: ${v2Studio.summary.samePageBrowseChecks}; unsupported-route captures: ${v2Studio.summary.unsupportedRouteCaptures}`);
          console.log(`- Issue #177 blocking accessibility findings: ${v2Studio.summary.blockingAccessibilityFindings}; horizontal-overflow findings: ${v2Studio.summary.horizontalOverflowFindings}; mutation-surface findings: ${v2Studio.summary.mutationSurfaceFindings}`);
          console.log(`- Issue #180 authoring references: ${v2Authoring.summary.referenceCount}; screenshots: ${v2Authoring.summary.screenshotCount}; keyboard completions: ${v2Authoring.summary.keyboardCompletionCount}; digest proofs: ${v2Authoring.summary.digestProofCount}`);
          console.log(`- Issue #180 blocking accessibility findings: ${v2Authoring.summary.blockingAccessibilityFindings}; horizontal-overflow findings: ${v2Authoring.summary.horizontalOverflowFindings}; persistent writes: ${v2Authoring.summary.persistentWrites}; Hive RPC attempts/writes: ${v2Authoring.summary.hiveRpcAttempts}/${v2Authoring.summary.hiveWrites}`);
          console.log(`- Issue #182 reorder references: ${v2Reorder.summary.referenceCount}; screenshots: ${v2Reorder.summary.screenshotCount}; keyboard completions: ${v2Reorder.summary.keyboardCompletionCount}; digest proofs: ${v2Reorder.summary.digestProofCount}; order proofs: ${v2Reorder.summary.structuralOrderProofCount}`);
          console.log(`- Issue #182 blocking accessibility findings: ${v2Reorder.summary.blockingAccessibilityFindings}; horizontal-overflow findings: ${v2Reorder.summary.horizontalOverflowFindings}; persistent writes: ${v2Reorder.summary.persistentWrites}; Hive RPC attempts/writes: ${v2Reorder.summary.hiveRpcAttempts}/${v2Reorder.summary.hiveWrites}`);
          console.log(`- Issue #184 cardinality references: ${v2Cardinality.summary.referenceCount}; screenshots: ${v2Cardinality.summary.screenshotCount}; keyboard completions: ${v2Cardinality.summary.keyboardCompletionCount}; digest proofs: ${v2Cardinality.summary.digestProofCount}; add/remove/round-trip proofs: ${v2Cardinality.summary.addProofCount}/${v2Cardinality.summary.removeProofCount}/${v2Cardinality.summary.exactRoundTripProofCount}`);
          console.log(`- Issue #184 blocking accessibility findings: ${v2Cardinality.summary.blockingAccessibilityFindings}; horizontal-overflow findings: ${v2Cardinality.summary.horizontalOverflowFindings}; persistent writes: ${v2Cardinality.summary.persistentWrites}; Hive RPC attempts/writes: ${v2Cardinality.summary.hiveRpcAttempts}/${v2Cardinality.summary.hiveWrites}`);
          console.log(`- Issue #186 Theme references/dimensions: ${v2Theme.summary.referenceCount}/${v2Theme.summary.dimensionCount}; screenshots: ${v2Theme.summary.screenshotCount}; keyboard proposals: ${v2Theme.summary.keyboardProposalCompletionCount}; digest proofs: ${v2Theme.summary.digestProofCount}`);
          console.log(`- Issue #186 discard/apply/undo/redo proofs: ${v2Theme.summary.discardProofCount}/${v2Theme.summary.applyProofCount}/${v2Theme.summary.undoProofCount}/${v2Theme.summary.redoProofCount}; semantic-class/computed-style proofs: ${v2Theme.summary.semanticClassProofCount}/${v2Theme.summary.computedStyleProofCount}`);
          console.log(`- Issue #186 blocking accessibility findings: ${v2Theme.summary.blockingAccessibilityFindings}; horizontal-overflow findings: ${v2Theme.summary.horizontalOverflowFindings}; persistent writes: ${v2Theme.summary.persistentWrites}; Hive RPC attempts/writes: ${v2Theme.summary.hiveRpcAttempts}/${v2Theme.summary.hiveWrites}`);
          console.log('- Historical full-page PNGs are ephemeral machine intermediates and are not uploaded as the acceptance artifact.');
          console.log('- A green job still does not constitute Project Lead visual approval; inspect the preserved bounded review artifacts.');
          NODE
      - name: Preserve bounded current visual evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: current-visual-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/current-visual-review
            artifacts/issue-130-presentation-review
            artifacts/issue-132-turnkey-review
            artifacts/v2-renderer-review
            artifacts/v2-studio-review
            artifacts/v2-authoring-review
            artifacts/v2-component-reorder-review
            artifacts/v2-component-cardinality-review
            artifacts/v2-theme-authoring-review
            artifacts/current-visual-machine-summary.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve visual failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: current-visual-failure-logs-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/visual-contract-logs
          if-no-files-found: warn
          retention-days: 30

  live-read-smoke:
    name: Live Hive read-only smoke
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Verify production targets through read-only RPC calls
        env:
          NODE_ENV: development
          SITE_NAME: 4th Street Bar
          HIVE_COMMUNITY_ID: hive-108590
          THREADS_CONTAINER_ACCOUNT: fourthst.threads
          HIVE_RPC_NODES: https://api.hive.blog,https://api.deathwing.me,https://api.openhive.network
          HIVE_WRITE_MODE: disabled
          LOG_LEVEL: info
        run: npm run smoke:live

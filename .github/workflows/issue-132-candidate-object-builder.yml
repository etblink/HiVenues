name: Issue 132 candidate object builder

on:
  push:
    branches:
      - release/issue-132-turnkey-v1
    paths:
      - '.github/workflows/issue-132-candidate-object-builder.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: issue-132-candidate-object-builder-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-object:
    name: Build unreferenced qualified candidate object
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact helper head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build remote Git objects without moving a ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '9910454561'
          EXPECTED_ARTIFACT_HEAD: 'da39f8326fb1aa1066582d7c0d6b093821d51751'
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.request
          import zipfile
          import tarfile

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          artifact_id = os.environ['ARTIFACT_ID']
          expected_artifact_head = os.environ['EXPECTED_ARTIFACT_HEAD']
          helper_path = '.github/workflows/issue-132-candidate-object-builder.yml'
          expected_paths = [
              'scripts/capture-issue-130-presentation-review.js',
              'src/venue/reference/source-authoring-surface-core.js',
              'test/c2-b3-social-product-framing.test.js',
              'test/c2-c-wallet-semantics.test.js',
              'test/c2-g1-distriator-handoff.test.js',
              'test/hv7-juniper-rendering.test.js',
              'test/issue-130-presentation-review-contract.test.js',
              'test/m15-shell-primitives.test.js',
              'test/m15-wallet-pay.test.js',
              'test/m16-copy-readiness.test.js',
              'test/m18-3-experience-redesign.test.js',
              'test/m19-1-copy-onboarding.test.js',
              'test/payment-api.test.js',
              'test/support/hv7-juniper-venue.js',
              'test/ux-1e-messages.test.js',
              'test/venue-package.test.js',
              'views/common/footer.ejs',
              'views/common/header.ejs',
              'views/pages/faq/index.ejs',
              'views/pages/onboarding/index.ejs',
              'views/pages/onboarding/staff.ejs',
              'views/pages/pay/index.ejs',
              'views/pages/pay/partials/receipt.ejs',
              'views/pages/profile/partials/activity.ejs',
              'views/pages/profile/partials/inbox.ejs',
              'views/pages/profile/partials/settings.ejs',
              'views/pages/profile/partials/user-wallet.ejs',
          ]

          def api(method, endpoint, payload=None, accept='application/vnd.github+json'):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}{endpoint}',
                  data=data,
                  method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': accept,
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'issue-132-object-builder',
                      **({'Content-Type': 'application/json'} if data is not None else {}),
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  raw = response.read()
                  if not raw:
                      return None
                  return json.loads(raw.decode('utf-8'))

          artifact = api('GET', f'/actions/artifacts/{artifact_id}')
          assert artifact['expired'] is False, artifact
          assert artifact['workflow_run']['head_sha'] == expected_artifact_head, artifact
          assert artifact['name'] == f'issue-132-gate-diagnostic-{expected_artifact_head}', artifact

          download = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}/zip',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'issue-132-object-builder',
              },
          )
          zip_path = Path('/tmp/issue132-qualified.zip')
          with urllib.request.urlopen(download, timeout=60) as response:
              zip_path.write_bytes(response.read())

          extract_root = Path('/tmp/issue132-qualified')
          extract_root.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(zip_path) as archive:
              archive.extractall(extract_root)

          assert (extract_root / 'issue132-check.status').read_text(encoding='utf-8').strip() == '0'
          actual_paths = (extract_root / 'issue132-changed-paths.txt').read_text(encoding='utf-8').splitlines()
          assert actual_paths == expected_paths, (actual_paths, expected_paths)

          candidate_root = Path('/tmp/issue132-candidate')
          candidate_root.mkdir(parents=True, exist_ok=True)
          with tarfile.open(extract_root / 'issue132-candidate-files.tar', 'r') as archive:
              archive.extractall(candidate_root)
          assert sorted(str(path.relative_to(candidate_root)).replace('\\', '/') for path in candidate_root.rglob('*') if path.is_file()) == expected_paths

          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          base_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()

          tree_entries = []
          blob_manifest = []
          for relative in expected_paths:
              payload = base64.b64encode((candidate_root / relative).read_bytes()).decode('ascii')
              blob = api('POST', '/git/blobs', {'content': payload, 'encoding': 'base64'})
              tree_entries.append({'path': relative, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
              blob_manifest.append({'path': relative, 'sha': blob['sha']})
          tree_entries.append({'path': helper_path, 'mode': '100644', 'type': 'blob', 'sha': None})

          tree = api('POST', '/git/trees', {'base_tree': base_tree, 'tree': tree_entries})
          commit = api('POST', '/git/commits', {
              'message': 'Finalize HiVenues current-facing branding',
              'tree': tree['sha'],
              'parents': [parent],
          })
          remote = api('GET', f"/git/commits/{commit['sha']}")
          assert remote['tree']['sha'] == tree['sha']
          assert [item['sha'] for item in remote['parents']] == [parent]

          result = {
              'candidate_commit': commit['sha'],
              'candidate_tree': tree['sha'],
              'parent': parent,
              'artifact_id': int(artifact_id),
              'artifact_digest': artifact.get('digest'),
              'artifact_head': expected_artifact_head,
              'changed_paths': expected_paths,
              'blobs': blob_manifest,
              'helper_deleted_in_candidate': True,
              'ref_updated': False,
          }
          Path('/tmp/issue132-object-result.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(result, indent=2))
          PY
      - name: Preserve object-builder result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-132-candidate-object-${{ github.sha }}
          path: /tmp/issue132-object-result.json
          if-no-files-found: error
          retention-days: 30

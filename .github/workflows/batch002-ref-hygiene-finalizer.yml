name: Batch-002 ref hygiene finalizer

on:
  pull_request:
    paths:
      - .github/workflows/batch002-ref-hygiene-finalizer.yml
  push:
    branches:
      - main
    paths:
      - .github/workflows/batch002-ref-hygiene-finalizer.yml

permissions:
  contents: write

concurrency:
  group: batch002-ref-hygiene-finalizer
  cancel-in-progress: false

jobs:
  verify-and-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_BASE_MAIN: fbb3da5eb1aeb89b3b67421d66c8820af9a06a15
      FINALIZER_BRANCH: maintenance/batch002-ref-hygiene-finalizer
      WORKFLOW_PATH: .github/workflows/batch002-ref-hygiene-finalizer.yml
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact bounded namespace and finalize only on canonical push
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          repo="$GITHUB_REPOSITORY"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            candidate_sha="$PR_HEAD_SHA"
            [[ "$PR_BASE_SHA" == "$EXPECTED_BASE_MAIN" ]] || {
              echo "Unexpected PR base: $PR_BASE_SHA" >&2
              exit 1
            }
          elif [[ "$EVENT_NAME" == "push" ]]; then
            candidate_sha="$GITHUB_SHA"
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
              echo "Execution is restricted to refs/heads/main" >&2
              exit 1
            }
            [[ "$PUSH_BEFORE_SHA" == "$EXPECTED_BASE_MAIN" ]] || {
              echo "Unexpected canonical transition parent: $PUSH_BEFORE_SHA" >&2
              exit 1
            }
          else
            echo "Unsupported event: $EVENT_NAME" >&2
            exit 1
          fi

          commit_parent="$(gh api "repos/$repo/git/commits/$candidate_sha" --jq '.parents[0].sha')"
          [[ "$commit_parent" == "$EXPECTED_BASE_MAIN" ]] || {
            echo "Candidate is not a direct child of expected canonical main." >&2
            exit 1
          }

          changed_paths="$(gh api "repos/$repo/compare/$EXPECTED_BASE_MAIN...$candidate_sha" --jq '.files[].filename')"
          [[ "$changed_paths" == "$WORKFLOW_PATH" ]] || {
            echo "Capability candidate changes unexpected paths:" >&2
            printf '%s\n' "$changed_paths" >&2
            exit 1
          }

          declare -A expected
          expected["audit/main-tree-retirement-batch002-consumers"]="459d005e0bb39df3995b27c4df2ddba086849c1b"
          expected["governance/main-tree-retirement-batch002-checkpoint-authorization"]="51cbd4a289de718ef23758fa761508bd41bb1edc"
          expected["governance/main-tree-retirement-batch002-completion"]="fbb3da5eb1aeb89b3b67421d66c8820af9a06a15"
          expected["governance/main-tree-retirement-batch002-docket"]="5d05927ef326537f195f7b1a746388b6bdb23124"
          expected["governance/main-tree-retirement-batch002-execution-authorization"]="84d67b0967c9fcf02aecc289ae167ccab8911b95"
          expected["maintenance/batch002-checkpoint-tag-capability"]="e6125da5241d64cb038e0dc1daec43c6bf8e2cfd"
          expected["maintenance/batch002-checkpoint-tag-teardown"]="57ae51370d80bf975cf589a274e17bac0817d1fc"
          expected["maintenance/ci-visual-scope-rationalization"]="d42698aa2119c42933d151e70457a01834f6bcdf"
          expected["maintenance/main-tree-retirement-batch002"]="ccfcfb699b288ce81ef6acc203402268dcae3ca5"
          expected["$FINALIZER_BRANCH"]="$candidate_sha"

          expected_names="$({
            printf '%s\n' main
            printf '%s\n' "${!expected[@]}"
          } | sort)"
          actual_names="$(gh api --paginate "repos/$repo/git/matching-refs/heads/" --jq '.[].ref' | sed 's#^refs/heads/##' | sort)"
          if [[ "$actual_names" != "$expected_names" ]]; then
            echo "Branch namespace drift detected." >&2
            echo "Expected:" >&2
            printf '%s\n' "$expected_names" >&2
            echo "Actual:" >&2
            printf '%s\n' "$actual_names" >&2
            exit 1
          fi

          for branch in "${!expected[@]}"; do
            actual_sha="$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha')"
            [[ "$actual_sha" == "${expected[$branch]}" ]] || {
              echo "Branch tip drift: $branch expected ${expected[$branch]} got $actual_sha" >&2
              exit 1
            }
          done

          archive_before="$(mktemp)"
          gh api --paginate "repos/$repo/git/matching-refs/tags/archive/" \
            --jq '.[] | "\(.ref) \(.object.sha)"' | sort > "$archive_before"
          [[ "$(wc -l < "$archive_before" | tr -d ' ')" == "19" ]] || {
            echo "Expected exactly 19 archive refs." >&2
            cat "$archive_before" >&2
            exit 1
          }
          grep -qx 'refs/tags/archive/main-tree/batch-20260831-002 8c2929e72a029116fb73c9bad197d4550721b2db' "$archive_before" || {
            echo "Batch-002 immutable checkpoint identity mismatch." >&2
            exit 1
          }

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "DRY_RUN=PASS"
            echo "No ref or file mutation performed on pull_request."
            exit 0
          fi

          main_tip="$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')"
          [[ "$main_tip" == "$candidate_sha" ]] || {
            echo "Canonical main raced before execution." >&2
            exit 1
          }

          for branch in "${!expected[@]}"; do
            actual_sha="$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha')"
            [[ "$actual_sha" == "${expected[$branch]}" ]] || {
              echo "Branch tip raced before deletion: $branch" >&2
              exit 1
            }
            gh api -X DELETE "repos/$repo/git/refs/heads/$branch"
            echo "Deleted exact authorized ref: $branch @ $actual_sha"
          done

          remaining_heads="$(gh api --paginate "repos/$repo/git/matching-refs/heads/" --jq '.[].ref' | sed 's#^refs/heads/##' | sort)"
          [[ "$remaining_heads" == "main" ]] || {
            echo "Unexpected branch namespace after bounded deletion:" >&2
            printf '%s\n' "$remaining_heads" >&2
            exit 1
          }

          archive_after="$(mktemp)"
          gh api --paginate "repos/$repo/git/matching-refs/tags/archive/" \
            --jq '.[] | "\(.ref) \(.object.sha)"' | sort > "$archive_after"
          cmp -s "$archive_before" "$archive_after" || {
            echo "Archive-ref ledger changed unexpectedly." >&2
            diff -u "$archive_before" "$archive_after" >&2 || true
            exit 1
          }

          main_tip="$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')"
          [[ "$main_tip" == "$candidate_sha" ]] || {
            echo "Canonical main raced before workflow teardown." >&2
            exit 1
          }

          local_workflow_blob="$(git hash-object "$WORKFLOW_PATH")"
          remote_workflow_blob="$(gh api "repos/$repo/contents/$WORKFLOW_PATH?ref=main" --jq '.sha')"
          [[ "$local_workflow_blob" == "$remote_workflow_blob" ]] || {
            echo "Workflow blob mismatch before self-removal." >&2
            exit 1
          }

          teardown_json="$(mktemp)"
          gh api -X DELETE "repos/$repo/contents/$WORKFLOW_PATH" \
            -f message='Remove temporary Batch-002 ref hygiene finalizer' \
            -f sha="$remote_workflow_blob" \
            -f branch=main > "$teardown_json"

          teardown_commit="$(jq -r '.commit.sha' "$teardown_json")"
          [[ -n "$teardown_commit" && "$teardown_commit" != "null" ]] || {
            echo "Workflow teardown did not return a commit." >&2
            cat "$teardown_json" >&2
            exit 1
          }

          echo "REF_HYGIENE=PASS"
          echo "ARCHIVE_LEDGER_UNCHANGED=PASS"
          echo "PRIVILEGED_WORKFLOW_REMOVAL_COMMIT=$teardown_commit"

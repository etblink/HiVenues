name: Candidate C Phase 2B Browser Qualification

on:
  pull_request:
    paths:
      - 'src/candidate-c/**'
      - 'views/candidate-c/**'
      - 'public/css/candidate-c*.css'
      - 'public/candidate-c/**'
      - 'public/js/candidate-c-studio.js'
      - 'test/candidate-c-phase2b-product.test.js'
      - 'test/candidate-c-phase2b-studio.test.js'
      - 'test/candidate-c-phase2b-urgent.test.js'
      - 'test/candidate-c-phase2b-h1.test.js'
      - 'test/candidate-c-mobile-review.test.js'
      - 'scripts/candidate-c-phase2b-browser.js'
      - 'scripts/candidate-c-phase2b-studio-browser-v2.js'
      - 'scripts/candidate-c-phase2b-urgent-browser-v2.js'
      - 'scripts/candidate-c-phase2b-h1-browser-v2.js'
      - 'scripts/candidate-c-phase2b-closure-browser.js'
      - 'scripts/candidate-c-post-astra-mobile-review.js'
      - '.github/workflows/candidate-c-phase2b-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-c-phase2b-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Phase 2B product + Studio browser evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify exact runtime provenance
        run: npm run release:check:runtime
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Install pinned Chromium runtime
        run: npx --no-install playwright install --with-deps chromium
      - name: Run Phase 2B deterministic contracts
        run: node --test --test-concurrency=1 test/candidate-c-phase2b-product.test.js test/candidate-c-phase2b-studio.test.js test/candidate-c-phase2b-urgent.test.js test/candidate-c-phase2b-h1.test.js test/candidate-c-mobile-review.test.js
      - name: Run Phase 2B Media/R3 Chromium qualification
        env:
          CANDIDATE_C_PHASE2B_REVIEW_ROOT: artifacts/candidate-c-phase2b-review
          CANDIDATE_C_PHASE2B_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/candidate-c-phase2b-browser.js
      - name: Run Phase 2B Studio D Chromium qualification
        env:
          CANDIDATE_C_PHASE2B_STUDIO_REVIEW_ROOT: artifacts/candidate-c-phase2b-studio-review
          CANDIDATE_C_PHASE2B_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/candidate-c-phase2b-studio-browser-v2.js
      - name: Run Phase 2B Workstream E urgent-operation Chromium qualification
        env:
          CANDIDATE_C_PHASE2B_URGENT_REVIEW_ROOT: artifacts/candidate-c-phase2b-urgent-review
          CANDIDATE_C_PHASE2B_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/candidate-c-phase2b-urgent-browser-v2.js
      - name: Run Phase 2B Workstream F H1 stress Chromium qualification
        env:
          CANDIDATE_C_PHASE2B_H1_REVIEW_ROOT: artifacts/candidate-c-phase2b-h1-review
          CANDIDATE_C_PHASE2B_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/candidate-c-phase2b-h1-browser-v2.js
      - name: Run Phase 2B closure matrix Chromium qualification (R1/R2/R3 × public/Activity/Studio × desktop/390px)
        env:
          CANDIDATE_C_PHASE2B_CLOSURE_REVIEW_ROOT: artifacts/candidate-c-phase2b-closure-review
          CANDIDATE_C_PHASE2B_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/candidate-c-phase2b-closure-browser.js
      - name: Run post-Astra R4 narrow-review + native-390 Chromium qualification
        env:
          CANDIDATE_C_POST_ASTRA_MOBILE_REVIEW_ROOT: artifacts/candidate-c-post-astra-mobile-review
          CANDIDATE_C_POST_ASTRA_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/candidate-c-post-astra-mobile-review.js
      - name: Publish Phase 2B browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-c-phase2b-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/candidate-c-phase2b-review
            artifacts/candidate-c-phase2b-studio-review
            artifacts/candidate-c-phase2b-urgent-review
            artifacts/candidate-c-phase2b-h1-review
            artifacts/candidate-c-phase2b-closure-review
            artifacts/candidate-c-post-astra-mobile-review
          if-no-files-found: warn
          retention-days: 90
      - name: Summarize Phase 2B evidence
        if: success()
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const product = JSON.parse(fs.readFileSync('artifacts/candidate-c-phase2b-review/manifest.json', 'utf8'));
          const studio = JSON.parse(fs.readFileSync('artifacts/candidate-c-phase2b-studio-review/manifest.json', 'utf8'));
          const urgent = JSON.parse(fs.readFileSync('artifacts/candidate-c-phase2b-urgent-review/manifest.json', 'utf8'));
          const h1 = JSON.parse(fs.readFileSync('artifacts/candidate-c-phase2b-h1-review/manifest.json', 'utf8'));
          const closure = JSON.parse(fs.readFileSync('artifacts/candidate-c-phase2b-closure-review/manifest.json', 'utf8'));
          const mobile = JSON.parse(fs.readFileSync('artifacts/candidate-c-post-astra-mobile-review/manifest.json', 'utf8'));
          console.log('## Candidate C Phase 2B browser evidence');
          console.log('');
          console.log(`- Exact candidate: ${product.candidate}`);
          console.log(`- Media/R3 screenshots: ${product.summary.screenshotCount}`);
          console.log(`- Studio D screenshots: ${studio.summary.screenshotCount}`);
          console.log(`- Workstream E urgent screenshots: ${urgent.summary.screenshotCount}`);
          console.log(`- Blocking accessibility findings: ${product.summary.blockingAccessibilityFindings + studio.summary.blockingAccessibilityFindings + urgent.summary.blockingAccessibilityFindings}`);
          console.log(`- Horizontal overflow findings: ${product.summary.horizontalOverflowFindings + studio.summary.horizontalOverflowFindings + urgent.summary.horizontalOverflowFindings}`);
          console.log(`- External requests: ${product.summary.externalRequests + studio.summary.externalRequests + urgent.summary.externalRequests}`);
          console.log(`- Unexpected console/page errors: ${product.summary.unexpectedConsoleErrors + studio.summary.unexpectedConsoleErrors + urgent.summary.unexpectedConsoleErrors}`);
          console.log(`- D proof: ${studio.proof.offer} · ${studio.proof.voice} · ${studio.proof.contact}`);
          console.log(`- Closure matrix screenshots: ${closure.summary.screenshotCount} (blocking a11y ${closure.summary.blockingAccessibilityFindings}, overflow ${closure.summary.horizontalOverflowFindings}, external ${closure.summary.externalRequests})`);
          console.log(`- R4 narrow/mobile review: ${mobile.summary.desktopNarrowHosts} desktop narrow + ${mobile.summary.native390Hosts} native 390 hosts, ${mobile.summary.screenshotCount} screenshots, overflow ${mobile.summary.horizontalOverflowFindings}, blocking a11y ${mobile.summary.blockingAccessibilityFindings}`);
          console.log(`- F/H1: ${h1.summary.customClientFiles} custom client file / ${h1.summary.customClientLines} lines · ${h1.summary.representativeEdits} edits at ${h1.summary.minRegionsPerEdit}–${h1.summary.maxRegionsPerEdit} regions · finding ${h1.finding}`);
          console.log(`- E proof: urgent release ${urgent.proof.urgentRelease.id} from ${urgent.proof.urgentRelease.baseReleaseId}; changed ${urgent.proof.urgentRelease.changedPaths.join(', ')}; stale-live rejected ${urgent.proof.staleLiveRejected.status}`);
          console.log(`- Hive RPC attempts/writes: ${studio.summary.hiveRpcAttempts}/${studio.summary.hiveWrites}`);
          console.log(`- Provider writes: ${studio.summary.providerWrites}`);
          console.log(`- Payment/signing/deployment effects: ${studio.summary.payments}/${studio.summary.signingAttempts}/${studio.summary.deployments}`);
          console.log('');
          console.log('Automated qualification does not imply Project Lead visual acceptance or Phase 2B H1 adjudication.');
          NODE

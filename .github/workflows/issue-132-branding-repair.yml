name: Issue 132 branding repair

on:
  pull_request:
    paths:
      - '.github/workflows/issue-132-branding-repair.yml'
      - 'views/**'
      - 'src/venue/**'
      - 'src/release/hivenues-name-audit.js'
      - 'test/**'

permissions:
  contents: write

concurrency:
  group: issue-132-branding-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    name: Repair current-facing HiVenues branding
    if: github.event.pull_request.head.ref == 'release/issue-132-turnkey-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Apply bounded current-UI branding repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          stale = re.compile(r'\b(?:Hive-Bar|Hive[ -]Venues)\b')
          current_ui = sorted((root / 'views').rglob('*.ejs')) + [
              root / 'src/venue/source-authoring-surface.js',
              root / 'src/venue/reference/source-authoring-surface-core.js',
          ]
          changed = []
          for filename in current_ui:
              text = filename.read_text(encoding='utf-8')
              repaired = stale.sub('HiVenues', text)
              if repaired != text:
                  filename.write_text(repaired, encoding='utf-8', newline='\n')
                  changed.append(str(filename))

          for relative in [
              'test/venue-source-authoring-surface.test.js',
              'test/hv7-juniper-rendering.test.js',
          ]:
              filename = root / relative
              text = filename.read_text(encoding='utf-8')
              repaired = text.replace('Hive-Venues', 'HiVenues')
              if repaired != text:
                  filename.write_text(repaired, encoding='utf-8', newline='\n')
                  changed.append(str(filename))

          audit = root / 'src/release/hivenues-name-audit.js'
          text = audit.read_text(encoding='utf-8')
          text = text.replace(
              "  'scripts/check-hivenues-v1-release.js',\n]);\nconst STALE_RELEASE_NAME_PATTERN",
              "  'scripts/check-hivenues-v1-release.js',\n  'src/venue/source-authoring-surface.js',\n  'src/venue/reference/source-authoring-surface-core.js',\n]);\nconst RELEASE_FACING_DIRECTORIES = Object.freeze(['views']);\nconst STALE_RELEASE_NAME_PATTERN",
          )
          helper = "function collectTextFiles(directory, root, fsImpl) {\n  const files = [];\n  const entries = fsImpl.readdirSync(directory, { withFileTypes: true })\n    .slice()\n    .sort((left, right) => left.name.localeCompare(right.name));\n  for (const entry of entries) {\n    const absolute = path.join(directory, entry.name);\n    if (entry.isDirectory()) {\n      files.push(...collectTextFiles(absolute, root, fsImpl));\n    } else if (entry.isFile() && entry.name.endsWith('.ejs')) {\n      files.push(path.relative(root, absolute).split(path.sep).join('/'));\n    }\n  }\n  return files;\n}\n\nfunction releaseFacingFiles(root, fsImpl) {\n  const discovered = RELEASE_FACING_DIRECTORIES.flatMap((relative) =>\n    collectTextFiles(path.join(root, relative), root, fsImpl));\n  return [...new Set([...RELEASE_FACING_FILES, ...discovered])].sort();\n}\n\n"
          text = text.replace('class HiVenuesNameAuditError extends Error {', helper + 'class HiVenuesNameAuditError extends Error {')
          text = text.replace('  for (const relative of RELEASE_FACING_FILES) {', '  const auditedFiles = releaseFacingFiles(root, fsImpl);\n  for (const relative of auditedFiles) {')
          text = text.replace("  return Object.freeze({ product: 'HiVenues', version: '1.0.0', auditedFiles: RELEASE_FACING_FILES });", "  return Object.freeze({ product: 'HiVenues', version: '1.0.0', auditedFiles: Object.freeze(auditedFiles) });")
          text = text.replace('module.exports = { HiVenuesNameAuditError, RELEASE_FACING_FILES, STALE_RELEASE_NAME_PATTERN, auditHiVenuesReleaseNames };', "module.exports = {\n  HiVenuesNameAuditError,\n  RELEASE_FACING_FILES,\n  RELEASE_FACING_DIRECTORIES,\n  STALE_RELEASE_NAME_PATTERN,\n  auditHiVenuesReleaseNames,\n};")
          audit.write_text(text, encoding='utf-8', newline='\n')
          changed.append(str(audit))

          print('Bounded repair files:')
          for filename in sorted(set(changed)):
              print(f'  {filename}')
          PY
      - name: Prove current UI has no stale product names
        shell: bash
        run: |
          set -euo pipefail
          npm run release:check:name
          if grep -RInE '\b(Hive-Bar|Hive[ -]Venues)\b' views src/venue/source-authoring-surface.js src/venue/reference/source-authoring-surface-core.js; then
            echo 'Stale current-facing product name remains.' >&2
            exit 1
          fi
      - name: Run targeted regressions
        run: node --test test/venue-source-authoring-surface.test.js test/hv7-juniper-rendering.test.js test/turnkey-release.test.js
      - name: Run complete deterministic quality gate
        run: npm run check
      - name: Validate patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git diff -- views src/venue/source-authoring-surface.js src/venue/reference/source-authoring-surface-core.js src/release/hivenues-name-audit.js test/venue-source-authoring-surface.test.js test/hv7-juniper-rendering.test.js
      - name: Commit bounded repair to Issue 132 branch
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No repair diff remains.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add views src/venue/source-authoring-surface.js src/venue/reference/source-authoring-surface-core.js src/release/hivenues-name-audit.js test/venue-source-authoring-surface.test.js test/hv7-juniper-rendering.test.js
          git commit -m 'Fix HiVenues current UI branding'
          git push origin "HEAD:${HEAD_BRANCH}"
